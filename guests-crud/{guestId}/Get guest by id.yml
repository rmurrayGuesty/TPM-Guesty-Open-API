info:
  name: Get guest by id
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/guests-crud/:guestId?fields=<string>"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: fields
      value: <string>
      type: query
      description: (Required) Fields
    - name: guestId
      value: <string>
      type: path
      description: (Required) Guest id
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

