info:
  name: Get guests list
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/guests-crud?columns=<string>&filters=<string>&limit=25&skip=0"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: columns
      value: <string>
      type: query
      description: (Required) Selection of columns, separated by space
    - name: filters
      value: <string>
      type: query
      description: Object of filters to query by
    - name: limit
      value: "25"
      type: query
      description: Limit guests results
    - name: skip
      value: "0"
      type: query
      description: Pagination skip
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: The guests list has been successfully pulled.
    request:
      url: "{{baseUrl}}/guests-crud?columns=<string>&filters=<string>&limit=25&skip=0"
      method: GET
      headers:
        - name: Accept
          value: application/json
        - name: authorization
          value: <API Key>
          description: "Added as a part of security scheme: apikey"
      params:
        - name: columns
          value: <string>
          type: query
          description: (Required) Selection of columns, separated by space
        - name: filters
          value: <string>
          type: query
          description: Object of filters to query by
        - name: limit
          value: "25"
          type: query
          description: Limit guests results
        - name: skip
          value: "0"
          type: query
          description: Pagination skip
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "results": {},
            "total": "<number>"
          }
  - name: Can not pull guests list, unauthorized
    request:
      url: "{{baseUrl}}/guests-crud?columns=<string>&filters=<string>&limit=25&skip=0"
      method: GET
      headers:
        - name: authorization
          value: <API Key>
          description: "Added as a part of security scheme: apikey"
      params:
        - name: columns
          value: <string>
          type: query
          description: (Required) Selection of columns, separated by space
        - name: filters
          value: <string>
          type: query
          description: Object of filters to query by
        - name: limit
          value: "25"
          type: query
          description: Limit guests results
        - name: skip
          value: "0"
          type: query
          description: Pagination skip
    response:
      status: 401
      statusText: Unauthorized
      body:
        type: text
        data: ""

