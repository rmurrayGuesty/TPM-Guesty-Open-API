info:
  name: List all users
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/users?fields=&skip=0&limit=200&sort=fullName&q=<string>"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: fields
      value: ""
      type: query
      description: Selection of fields, separated by space. If fields not be chosen response will be return with all fields. The selected fields from the users table will be returned inside the response
    - name: skip
      value: "0"
      type: query
      description: Pagination
    - name: limit
      value: "200"
      type: query
      description: "Pagination, max: 200"
    - name: sort
      value: fullName
      type: query
      description: Sorting
    - name: q
      value: <string>
      type: query
      description: Search query string. Searches in fullName, emails, phones
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

