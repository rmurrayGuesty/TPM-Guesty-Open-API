info:
  name: Get user
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/users/:id?fields="
  headers:
    - name: Accept
      value: application/json
  params:
    - name: fields
      value: ""
      type: query
      description: Selection of fields, separated by space
    - name: id
      value: <string>
      type: path
      description: (Required) User MongoDB _id
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

