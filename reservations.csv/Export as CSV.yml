  - name: Unhandled exception. Something went wrong on server.
    request:
      url: "{{baseUrl}}/reservations.csv?filters=[object Object]&fields=<string>&sort=<string>&limit=<integer>&skip=<integer>"
      method: POST
      headers:
        - name: Accept
