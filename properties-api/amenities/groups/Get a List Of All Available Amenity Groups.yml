info:
  name: Get a List Of All Available Amenity Groups
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/properties-api/amenities/groups"
  headers:
    - name: Accept
      value: application/json
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: A list of all available amenities, groups
    request:
      url: "{{baseUrl}}/properties-api/amenities/groups"
      method: GET
      headers:
        - name: Accept
          value: application/json
        - name: authorization
          value: <API Key>
          description: "Added as a part of security scheme: apikey"
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            "<string>",
            "<string>"
          ]
  - name: Unauthorized Request
    request:
      url: "{{baseUrl}}/properties-api/amenities/groups"
      method: GET
      headers:
        - name: Accept
          value: application/json
        - name: authorization
          value: <API Key>
          description: "Added as a part of security scheme: apikey"
    response:
      status: 403
      statusText: Forbidden
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": {
              "code": "<string>",
              "message": "<string>"
            }
          }

