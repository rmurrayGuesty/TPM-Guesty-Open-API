info:
  name: Set Amenities For Property
  type: http
  seq: 2

http:
  method: PUT
  url: "{{baseUrl}}/properties-api/amenities/:propertyId"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: propertyId
      value: <string>
      type: path
      description: (Required) The id of the property to set amenities to
  body:
    type: json
    data: |-
      {
        "amenities": [
          "<string>",
          "<string>"
        ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: Return the updated list of amenities assigned to specific property
    request:
      url: "{{baseUrl}}/properties-api/amenities/:propertyId"
      method: PUT
      headers:
        - name: Content-Type
          value: application/json
        - name: Accept
          value: application/json
        - name: authorization
          value: <API Key>
          description: "Added as a part of security scheme: apikey"
      params:
        - name: propertyId
          value: ""
          type: path
      body:
        type: json
        data: |-
          {
            "amenities": [
              "<string>",
              "<string>"
            ]
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "propertyId": "<string>",
            "amenities": [
              "<string>",
              "<string>"
            ],
            "otherAmenities": [
              "<string>",
              "<string>"
            ]
          }
  - name: Only MTL and SINGLE property types are supported
    request:
      url: "{{baseUrl}}/properties-api/amenities/:propertyId"
      method: PUT
      headers:
