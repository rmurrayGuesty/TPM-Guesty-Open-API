info:
  name: Get a list of all complexes
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/properties-api/complexes"
  headers:
    - name: Accept
      value: application/json
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: A list of all complexes
    request:
      url: "{{baseUrl}}/properties-api/complexes"
      method: GET
      headers:
        - name: Accept
          value: application/json
        - name: authorization
          value: <API Key>
          description: "Added as a part of security scheme: apikey"
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            {
              "id": "<string>",
              "title": "<string>",
              "nickname": "<string>",
              "propertyIds": [
                "<string>",
                "<string>"
              ],
              "tags": [
                "<string>",
                "<string>"
              ]
            },
            {
              "id": "<string>",
              "title": "<string>",
              "nickname": "<string>",
              "propertyIds": [
                "<string>",
                "<string>"
              ],
              "tags": [
                "<string>",
                "<string>"
              ]
            }
          ]
  - name: Unauthorized Request
    request:
      url: "{{baseUrl}}/properties-api/complexes"
      method: GET
      headers:
        - name: Accept
          value: application/json
        - name: authorization
          value: <API Key>
          description: "Added as a part of security scheme: apikey"
    response:
      status: 403
      statusText: Forbidden
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": {
              "code": "<string>",
              "message": "<string>"
            }
          }
  - name: No Complexs were found
    request:
      url: "{{baseUrl}}/properties-api/complexes"
      method: GET
      headers:
        - name: Accept
          value: application/json
        - name: authorization
          value: <API Key>
          description: "Added as a part of security scheme: apikey"
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": {
              "message": "<string>",
              "status": "<integer>",
              "data": "<string>"
            }
          }

