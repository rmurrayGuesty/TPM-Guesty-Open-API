info:
  name: Create a new complex
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/properties-api/complexes"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
        "title": "<string>",
        "nickname": "<string>",
        "propertyIds": [
          "<string>",
          "<string>"
        ],
        "tags": [
          "<string>",
          "<string>"
        ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
