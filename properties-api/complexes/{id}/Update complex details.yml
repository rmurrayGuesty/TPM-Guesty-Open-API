info:
  name: Update complex details
  type: http
  seq: 4

http:
  method: PUT
  url: "{{baseUrl}}/properties-api/complexes/:id"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: id
      value: <string>
      type: path
      description: (Required) The id of the complex to update
  body:
    type: json
    data: |-
      {
        "title": "<string>",
        "nickname": "<string>",
        "tags": [
          "<string>",
          "<string>"
        ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

