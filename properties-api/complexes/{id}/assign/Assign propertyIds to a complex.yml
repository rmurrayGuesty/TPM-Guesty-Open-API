info:
  name: Assign propertyIds to a complex
  type: http
  seq: 1

http:
  method: PUT
  url: "{{baseUrl}}/properties-api/complexes/:id/assign"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: id
      value: <string>
      type: path
      description: (Required) The id of the complex to update
  body:
    type: json
    data: |-
      [
        "<string>",
        "<string>"
      ]
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: The complex was updated successfully. If all of the property Ids exist in the complex, a 404 will be returned.
    request:
      url: "{{baseUrl}}/properties-api/complexes/:id/assign"
      method: PUT
      headers:
        - name: Content-Type
          value: application/json
        - name: Accept
          value: application/json
        - name: authorization
          value: <API Key>
          description: "Added as a part of security scheme: apikey"
      params:
        - name: id
          value: ""
          type: path
      body:
        type: json
        data: |-
          [
            "<string>",
            "<string>"
          ]
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "propertyIds": [
              "<string>",
              "<string>"
            ]
          }
  - name: Unauthorized Request
    request:
      url: "{{baseUrl}}/properties-api/complexes/:id/assign"
      method: PUT
      headers:
        - name: Content-Type
          value: application/json
        - name: Accept
          value: application/json
        - name: authorization
          value: <API Key>
          description: "Added as a part of security scheme: apikey"
      params:
        - name: id
          value: ""
          type: path
      body:
        type: json
        data: |-
          [
            "<string>",
            "<string>"
          ]
    response:
      status: 403
      statusText: Forbidden
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": {
              "code": "<string>",
              "message": "<string>"
            }
          }
  - name: Complex not found
    request:
      url: "{{baseUrl}}/properties-api/complexes/:id/assign"
      method: PUT
      headers:
        - name: Content-Type
          value: application/json
        - name: Accept
          value: application/json
        - name: authorization
          value: <API Key>
          description: "Added as a part of security scheme: apikey"
      params:
        - name: id
          value: ""
          type: path
      body:
        type: json
        data: |-
          [
            "<string>",
            "<string>"
          ]
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": {
              "message": "<string>",
              "status": "<integer>",
              "data": "<string>"
            }
          }

docs: Assign propertyIds to a specific complex based on the complexId, and returns the assigned values
