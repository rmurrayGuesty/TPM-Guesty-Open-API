info:
  name: Delete complex
  type: http
  seq: 5

http:
  method: DELETE
  url: "{{baseUrl}}/properties-api/complexes/:id"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: id
      value: <string>
      type: path
      description: (Required) The id of the complex to delete
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: The complex was deleted successfully
    request:
      url: "{{baseUrl}}/properties-api/complexes/:id"
      method: DELETE
      headers:
        - name: Accept
          value: application/json
        - name: authorization
          value: <API Key>
          description: "Added as a part of security scheme: apikey"
      params:
        - name: id
          value: ""
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "acknowledged": "<boolean>",
            "deletedCount": "<number>"
          }
  - name: Unauthorized Request
    request:
      url: "{{baseUrl}}/properties-api/complexes/:id"
      method: DELETE
      headers:
        - name: Accept
          value: application/json
        - name: authorization
          value: <API Key>
          description: "Added as a part of security scheme: apikey"
      params:
        - name: id
          value: ""
