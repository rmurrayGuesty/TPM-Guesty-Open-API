  - name: Complex not found
    request:
      url: "{{baseUrl}}/properties-api/complexes/:id"
      method: DELETE
      headers:
        - name: Accept
          value: application/json
        - name: authorization
          value: <API Key>
          description: "Added as a part of security scheme: apikey"
      params:
        - name: id
          value: ""
          type: path
    response:
      status: 404
