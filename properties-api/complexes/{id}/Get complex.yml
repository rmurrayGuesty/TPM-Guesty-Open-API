info:
  name: Get complex
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/properties-api/complexes/:id"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: id
      value: <string>
      type: path
      description: (Required) The id of the complex to retrieve
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: Return the requested complex.
    request:
      url: "{{baseUrl}}/properties-api/complexes/:id"
      method: GET
      headers:
        - name: Accept
          value: application/json
        - name: authorization
          value: <API Key>
          description: "Added as a part of security scheme: apikey"
      params:
        - name: id
          value: ""
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": "<string>",
            "title": "<string>",
            "nickname": "<string>",
            "propertyIds": [
              "<string>",
              "<string>"
            ],
            "tags": [
              "<string>",
              "<string>"
            ]
          }
  - name: Unauthorized Request
    request:
      url: "{{baseUrl}}/properties-api/complexes/:id"
      method: GET
      headers:
        - name: Accept
          value: application/json
        - name: authorization
          value: <API Key>
          description: "Added as a part of security scheme: apikey"
      params:
        - name: id
          value: ""
          type: path
    response:
      status: 403
      statusText: Forbidden
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": {
              "code": "<string>",
              "message": "<string>"
            }
          }
  - name: Complex not found
    request:
      url: "{{baseUrl}}/properties-api/complexes/:id"
      method: GET
      headers:
        - name: Accept
          value: application/json
        - name: authorization
          value: <API Key>
          description: "Added as a part of security scheme: apikey"
      params:
        - name: id
          value: ""
          type: path
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": {
              "message": "<string>",
              "status": "<integer>",
              "data": "<string>"
            }
          }

