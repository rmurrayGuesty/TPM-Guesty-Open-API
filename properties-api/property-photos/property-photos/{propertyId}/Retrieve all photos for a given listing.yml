info:
  name: Retrieve all photos for a given listing.
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/properties-api/property-photos/property-photos/:propertyId"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: propertyId
      value: <string>
      type: path
      description: (Required) Guesty property ID.
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: Returns a list of all the property's photos.
    request:
      url: "{{baseUrl}}/properties-api/property-photos/property-photos/:propertyId"
      method: GET
      headers:
        - name: Accept
          value: application/json
        - name: authorization
          value: <API Key>
          description: "Added as a part of security scheme: apikey"
      params:
        - name: propertyId
          value: ""
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            {
              "_id": "<string>",
              "source": "<string>",
              "original": "<string>",
              "thumbnail": "<string>",
              "caption": "<string>",
              "index": "<number>",
              "createdAt": "<dateTime>",
              "updatedAt": "<dateTime>"
            },
