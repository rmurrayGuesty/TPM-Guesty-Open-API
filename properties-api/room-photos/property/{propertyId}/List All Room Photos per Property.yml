info:
  name: List All Room Photos per Property
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/properties-api/room-photos/property/:propertyId"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: propertyId
      value: <string>
      type: path
      description: (Required) The id of the property
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: Returns a list of all property room photo mappings, including photo ID, space ID and photo URL.
    request:
      url: "{{baseUrl}}/properties-api/room-photos/property/:propertyId"
      method: GET
      headers:
        - name: Accept
          value: application/json
        - name: authorization
          value: <API Key>
          description: "Added as a part of security scheme: apikey"
      params:
        - name: propertyId
          value: ""
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "propertyId": "<string>",
            "roomPhotos": [
              {
                "_id": "<string>",
                "accountId": "<string>",
                "spaceId": "<string>",
                "photoId": "<string>",
                "photoUrl": "<string>"
              },
              {
                "_id": "<string>",
                "accountId": "<string>",
                "spaceId": "<string>",
                "photoId": "<string>",
                "photoUrl": "<string>"
              }
            ]
          }
  - name: Unauthorized Request.
    request:
      url: "{{baseUrl}}/properties-api/room-photos/property/:propertyId"
      method: GET
      headers:
        - name: Accept
          value: application/json
        - name: authorization
          value: <API Key>
          description: "Added as a part of security scheme: apikey"
      params:
        - name: propertyId
          value: ""
          type: path
    response:
      status: 403
      statusText: Forbidden
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": {
              "code": "<string>",
              "message": "<string>"
            }
          }
  - name: Property not found.
    request:
      url: "{{baseUrl}}/properties-api/room-photos/property/:propertyId"
      method: GET
      headers:
        - name: Accept
          value: application/json
        - name: authorization
          value: <API Key>
          description: "Added as a part of security scheme: apikey"
      params:
        - name: propertyId
          value: ""
          type: path
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": {
              "message": "<string>",
              "status": "<integer>"
            }
          }

docs: Retrieve a list of all room photo mappings for each property, including photo ID, space ID, and photo URL.
