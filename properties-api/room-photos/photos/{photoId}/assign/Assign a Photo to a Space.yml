info:
  name: Assign a Photo to a Space
  type: http
  seq: 1

http:
  method: PUT
  url: "{{baseUrl}}/properties-api/room-photos/photos/:photoId/assign"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: photoId
      value: <string>
      type: path
      description: (Required) The id of the photo to set spaceId to
  body:
    type: json
    data: |-
      {
        "spaceId": "<string>",
        "propertyId": "<string>"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: Returns a list of all property room photo mappings, including photo ID, space ID and photo URL.
    request:
      url: "{{baseUrl}}/properties-api/room-photos/photos/:photoId/assign"
      method: PUT
      headers:
        - name: Content-Type
          value: application/json
        - name: Accept
          value: application/json
        - name: authorization
          value: <API Key>
          description: "Added as a part of security scheme: apikey"
      params:
        - name: photoId
          value: ""
          type: path
      body:
        type: json
        data: |-
          {
            "spaceId": "<string>",
            "propertyId": "<string>"
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "propertyId": "<string>",
            "roomPhotos": [
              {
                "_id": "<string>",
                "accountId": "<string>",
                "spaceId": "<string>",
                "photoId": "<string>",
                "photoUrl": "<string>"
              },
              {
                "_id": "<string>",
                "accountId": "<string>",
                "spaceId": "<string>",
                "photoId": "<string>",
                "photoUrl": "<string>"
              }
            ]
          }
  - name: Unauthorized Request.
    request:
      url: "{{baseUrl}}/properties-api/room-photos/photos/:photoId/assign"
      method: PUT
      headers:
        - name: Content-Type
          value: application/json
        - name: Accept
          value: application/json
        - name: authorization
          value: <API Key>
          description: "Added as a part of security scheme: apikey"
      params:
        - name: photoId
          value: ""
          type: path
      body:
        type: json
        data: |-
          {
            "spaceId": "<string>",
            "propertyId": "<string>"
          }
    response:
      status: 403
      statusText: Forbidden
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": {
              "code": "<string>",
              "message": "<string>"
            }
          }
  - name: Property not found.
    request:
      url: "{{baseUrl}}/properties-api/room-photos/photos/:photoId/assign"
      method: PUT
      headers:
        - name: Content-Type
          value: application/json
        - name: Accept
          value: application/json
        - name: authorization
          value: <API Key>
          description: "Added as a part of security scheme: apikey"
      params:
        - name: photoId
          value: ""
          type: path
      body:
        type: json
        data: |-
          {
            "spaceId": "<string>",
            "propertyId": "<string>"
          }
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": {
              "message": "<string>",
              "status": "<integer>"
            }
          }

docs: Assigns the selected photo to a space.
