info:
  name: Retrieve a property's LoS calendar for the specified dates.
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/rm-los-calendar-service/listing/:listingId/calendar?startDate=<string>&endDate=<string>&limit=100&skip=0"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: startDate
      value: <string>
      type: query
      description: (Required) LoS calendar search start date
    - name: endDate
      value: <string>
      type: query
      description: (Required) LoS calendar search end date
    - name: limit
      value: "100"
      type: query
      description: The requested limit (number of results) of the call.
    - name: skip
      value: "0"
      type: query
      description: The requested offset (skipped results) of the call.
    - name: listingId
      value: <string>
      type: path
      description: (Required) Guesty Listing ID.
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

