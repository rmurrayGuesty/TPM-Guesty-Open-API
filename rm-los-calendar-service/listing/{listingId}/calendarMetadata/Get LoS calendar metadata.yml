info:
  name: Get LoS calendar metadata
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/rm-los-calendar-service/listing/:listingId/calendarMetadata"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: listingId
      value: <string>
      type: path
      description: (Required) Guesty Listing ID.
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: LoS calendar metadata has been received
    request:
      url: "{{baseUrl}}/rm-los-calendar-service/listing/:listingId/calendarMetadata"
      method: GET
      headers:
        - name: Accept
          value: application/json
        - name: authorization
          value: <API Key>
          description: "Added as a part of security scheme: apikey"
      params:
        - name: listingId
          value: ""
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "calendarMetadata": {
              "listingId": "<string>",
              "status": "ACTIVE"
            },
            "requestId": "<string>"
          }
