info:
  name: Create a group reservation
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/reservations-v3/group"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
        "quoteAndRatePlanIds": [
          {
            "quoteId": "<string>",
            "ratePlanId": "<string>",
            "status": "confirmed",
            "booker": {
              "_id": "<string>",
              "fullName": "<string>"
            }
          },
          {
            "quoteId": "<string>",
            "ratePlanId": "<string>",
            "status": "reserved",
            "booker": {
              "_id": "<string>",
              "fullName": "<string>"
            }
          }
        ],
        "name": "<string>",
        "source": "<string>",
        "status": "closed",
        "reservedUntil": 24,
        "note": "<string>",
        "groupBooker": {
          "_id": "<string>",
          "fullName": "<string>"
        },
        "coupons": [
          "<string>",
          "<string>"
        ],
        "chargeMethod": "PER_GROUP"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

