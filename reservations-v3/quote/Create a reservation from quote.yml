      value: application/json
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
        "quoteId": "<string>",
        "status": "awaiting_payment",
        "ratePlanId": "<string>",
        "reservedUntil": -1,
        "guestId": "<string>",
        "guest": {
          "firstName": "<string>",
          "lastName": "<string>",
          "phones": [
            "<string>",
            "<string>"
          ],
          "email": "<string>",
          "address": {
            "street": "<string>",
            "zipCode": "<string>",
            "city": "<string>",
            "state": "<string>",
            "country": "<string>",
            "countryCode": "<string>"
          }
        },
        "ignoreCalendar": "<boolean>",
        "ignoreTerms": "<boolean>",
        "ignoreBlocks": "<boolean>",
        "confirmedAt": "<dateTime>"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

