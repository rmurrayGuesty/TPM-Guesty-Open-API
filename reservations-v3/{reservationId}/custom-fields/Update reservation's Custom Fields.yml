info:
  name: Update reservation's Custom Fields
  type: http
  seq: 1

http:
  method: PUT
  url: "{{baseUrl}}/reservations-v3/:reservationId/custom-fields"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: reservationId
      value: <string>
      type: path
      description: (Required) The Guesty reservation ID
  body:
    type: json
    data: |-
      {
        "customFields": [
          {
            "fieldId": "<string>",
            "value": {}
          },
          {
            "fieldId": "<string>",
            "value": {}
          }
        ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: Reservation Custom Fields Updated
    request:
      url: "{{baseUrl}}/reservations-v3/:reservationId/custom-fields"
      method: PUT
      headers:
        - name: Content-Type
          value: application/json
        - name: Accept
          value: application/json
        - name: authorization
          value: <API Key>
          description: "Added as a part of security scheme: apikey"
      params:
        - name: reservationId
          value: ""
          type: path
      body:
        type: json
        data: |-
          {
            "customFields": [
              {
                "fieldId": "<string>",
                "value": {}
              },
              {
                "fieldId": "<string>",
                "value": {}
              }
            ]
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "reservationId": "<string>",
            "customFields": [
              {
                "_id": "<string>",
                "fieldId": "<string>",
                "value": {}
              },
              {
                "_id": "<string>",
                "fieldId": "<string>",
                "value": {}
              }
            ]
          }
  - name: Validation error - failed updating custom fields.
    request:
      url: "{{baseUrl}}/reservations-v3/:reservationId/custom-fields"
      method: PUT
      headers:
        - name: Content-Type
          value: application/json
        - name: authorization
          value: <API Key>
          description: "Added as a part of security scheme: apikey"
      params:
        - name: reservationId
          value: ""
          type: path
      body:
        type: json
        data: |-
          {
            "customFields": [
              {
                "fieldId": "<string>",
                "value": {}
              },
              {
                "fieldId": "<string>",
                "value": {}
              }
            ]
          }
    response:
      status: 422
      statusText: Unprocessable Entity (WebDAV) (RFC 4918)
      body:
        type: text
        data: ""

docs: Edit the values of any custom fields on an existing reservation.
