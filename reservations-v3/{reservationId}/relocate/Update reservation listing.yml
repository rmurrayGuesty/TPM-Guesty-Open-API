info:
  name: Update reservation listing
  type: http
  seq: 1

http:
  method: PUT
  url: "{{baseUrl}}/reservations-v3/:reservationId/relocate"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: reservationId
      value: <string>
      type: path
      description: (Required) The Guesty reservation ID
  body:
    type: json
    data: |-
      {
        "listingId": "<string>"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
