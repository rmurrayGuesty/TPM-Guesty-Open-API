docs: Create a confirmed owner reservation - This endpoint enables the creation of an Owner Reservation instantly with minimal required input. It is designed for simplicity and speed, focusing on essential details only. Behind the scenes, it will create a quote + reservation from a quote picking the first applicable rate plan and promotions
