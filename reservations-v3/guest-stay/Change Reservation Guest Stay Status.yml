info:
  name: Change Reservation Guest Stay Status
  type: http
  seq: 1

http:
  method: PUT
  url: "{{baseUrl}}/reservations-v3/guest-stay"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
        "reservationId": "<string>",
        "status": "checked_in"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

