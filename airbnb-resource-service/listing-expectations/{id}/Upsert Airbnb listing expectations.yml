info:
  name: Upsert Airbnb listing expectations
  type: http
  seq: 1

http:
  method: PUT
  url: "{{baseUrl}}/airbnb-resource-service/listing-expectations/:id"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: id
      value: <string>
      type: path
      description: (Required) Guesty listing id
  body:
    type: json
    data: |-
      {
        "listingExpectationsForGuests": {
          "type": "weapons",
          "added_details": "<string>"
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

