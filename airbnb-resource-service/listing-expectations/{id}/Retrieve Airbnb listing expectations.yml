info:
  name: Retrieve Airbnb listing expectations
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/airbnb-resource-service/listing-expectations/:id"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: id
      value: <string>
      type: path
      description: (Required) Guesty listing id
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: Listing expectations for Airbnb channel
    request:
      url: "{{baseUrl}}/airbnb-resource-service/listing-expectations/:id"
      method: GET
      headers:
        - name: Accept
          value: application/json
        - name: authorization
          value: <API Key>
          description: "Added as a part of security scheme: apikey"
      params:
        - name: id
          value: ""
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "airbnbData": [
              "<string>",
              "<string>"
            ],
            "_id": "<string>",
            "internalListingId": "<string>",
            "externalListingId": "<string>",
            "integrationId": "<string>",
            "createdAt": "<dateTime>",
            "updatedAt": "<dateTime>"
          }
  - name: Unauthorized
