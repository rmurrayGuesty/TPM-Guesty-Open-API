info:
  name: Assign listings to Business Models
  type: http
  seq: 1

http:
  method: PUT
  url: "{{baseUrl}}/business-models-api/assignment/:businessModelId"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: businessModelId
      value: <string>
      type: path
      description: (Required) Business Model ID that provided listings will be assigned to
  body:
    type: json
    data: |-
      {
        "listingIds": [
          "<string>",
          "<string>"
        ],
        "fromDate": "<string>"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

