info:
  name: Get Business Models
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/business-models-api/light-business-models?skip=<number>&limit=<number>"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: skip
      value: <number>
      type: query
      description: Skip number of records. In case nothing provided so nothing will be skipped
    - name: limit
      value: <number>
      type: query
      description: Limit for list of records. In case nothing provided all the records will be returned
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

