info:
  name: List all phone book entries
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/contacts?q=<string>&fields=<string>&ids=<string>&limit=<number>&skip=<number>"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: q
      value: <string>
      type: query
      description: Search query string. Searches in fullName, emails, phones
    - name: fields
      value: <string>
      type: query
      description: Selection of fields, separated by space. If fields not be chosen response will be return with all fields. The selected fields from the users table will be returned inside the response
    - name: ids
      value: <string>
      type: query
      description: Limit results to these ids, comma separated string
    - name: limit
      value: <number>
      type: query
      description: "Pagination limit, max: 100"
    - name: skip
      value: <number>
      type: query
      description: Pagination skip
  auth:
    type: apikey
    key: authorization
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

