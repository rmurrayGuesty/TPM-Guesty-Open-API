info:
  name: Update a phone book entry
  type: http
  seq: 3

http:
  method: PUT
  url: "{{baseUrl}}/contacts/:id"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: id
      value: <string>
      type: path
      description: (Required) Entry ID
  body:
    type: json
    data: |-
      {
        "_id": "<string>",
        "firstName": "<string>",
        "lastName": "<string>",
        "fullName": "<string>",
        "nickName": "<string>",
        "title": "<string>",
        "company": "<string>",
        "picture": {
          "thumbnail": "<string>",
          "regular": "<string>",
          "large": "<string>"
        },
        "emails": [
          "<string>",
          "<string>"
        ],
        "phones": [
          "<string>",
          "<string>"
        ],
        "preferredContactMethod": "email",
        "email": "<string>",
        "phone": "<string>",
        "notes": "<string>"
      }
  auth:
    type: apikey
    key: authorization
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: Entry object
    request:
      url: "{{baseUrl}}/contacts/:id"
      method: PUT
      headers:
        - name: Content-Type
          value: application/json
        - name: Accept
