info:
  name: Get a specific phone book entry
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/contacts/:id?fields=<string>"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: fields
      value: <string>
      type: query
      description: Selection of fields, separated by space. If fields not be chosen response will be return with all fields. The selected fields from the users table will be returned inside the response
    - name: id
      value: <string>
      type: path
      description: (Required) Entry ID
  auth:
    type: apikey
    key: authorization
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: Phone Book Entries list
    request:
      url: "{{baseUrl}}/contacts/:id?fields=<string>"
      method: GET
      headers:
        - name: Accept
          value: application/json
        - name: authorization
          value: <API Key>
          description: "Added as a part of security scheme: apikey"
      params:
        - name: fields
          value: <string>
          type: query
          description: Selection of fields, separated by space. If fields not be chosen response will be return with all fields. The selected fields from the users table will be returned inside the response
        - name: id
          value: ""
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "accountId": "<string>",
            "_id": "<string>",
            "firstName": "<string>",
            "lastName": "<string>",
            "fullName": "<string>",
            "nickName": "<string>",
            "title": "<string>",
            "company": "<string>",
            "picture": {
              "thumbnail": "<string>",
              "regular": "<string>",
              "large": "<string>"
            },
            "emails": [
              "<string>",
              "<string>"
            ],
            "phones": [
              "<string>",
              "<string>"
            ],
            "preferredContactMethod": "sms",
            "email": "<string>",
            "phone": "<string>",
            "notes": "<string>"
          }

