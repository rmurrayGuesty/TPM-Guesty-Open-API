info:
  name: Assign listings to promotion.
  type: http
  seq: 1

http:
  method: PUT
  url: "{{baseUrl}}/rm-promotions/promotions/:promotionId/assign"
  headers:
    - name: Content-Type
      value: application/json
  params:
    - name: promotionId
      value: <string>
      type: path
      description: (Required) promotion id.
  body:
    type: json
    data: |-
      {
        "listings": []
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

