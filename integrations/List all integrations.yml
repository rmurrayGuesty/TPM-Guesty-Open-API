info:
  name: List all integrations
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/integrations?fields=<string>&limit=<number>&skip=<number>&sort=<string>"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: fields
      value: <string>
      type: query
      description: Selection of fields, separated by space
    - name: limit
      value: <number>
      type: query
      description: "Limit for list of records. Default value: `25`, max: `100`"
    - name: skip
      value: <number>
      type: query
      description: Skip number of records. In case nothing provided so nothing will be skipped
    - name: sort
      value: <string>
      type: query
      description: Ascending alphabetical sort , use - to descending sort. Default `-active nickname`
  auth:
    type: apikey
    key: authorization
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

