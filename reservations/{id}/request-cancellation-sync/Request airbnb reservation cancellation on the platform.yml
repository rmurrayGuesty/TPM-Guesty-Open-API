info:
  name: Request airbnb reservation cancellation on the platform
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/reservations/:id/request-cancellation-sync"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: id
      value: <string>
      type: path
      description: (Required) Reservation ID
  body:
    type: json
    data: |-
      {
        "cancellationData": {
          "reason": "DECLINE_REASON_HOST_OTHER",
          "subReason": "DECLINE_REASON_HOST_EMERGENCY",
          "messageToAirbnb": "<string>",
          "messageToGuest": "<string>"
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

