      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: <string>
  - name: Unhandled exception. Something went wrong on server.
    request:
      url: "{{baseUrl}}/reservations/:id/custom-fields"
      method: GET
      headers:
        - name: Accept
          value: application/json
        - name: authorization
          value: <API Key>
