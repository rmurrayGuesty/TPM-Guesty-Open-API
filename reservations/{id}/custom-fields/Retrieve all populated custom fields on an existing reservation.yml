info:
  name: Retrieve all populated custom fields on an existing reservation.
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/reservations/:id/custom-fields"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: id
      value: <string>
      type: path
      description: (Required) Reservation ID
  auth:
    type: apikey
    key: authorization
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: Custom fields of reservation
    request:
      url: "{{baseUrl}}/reservations/:id/custom-fields"
      method: GET
      headers:
        - name: Accept
          value: application/json
        - name: authorization
          value: <API Key>
          description: "Added as a part of security scheme: apikey"
      params:
        - name: id
          value: ""
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "example": "[\n    {\n      \"fieldId\": \"5dc03b42e28baf001e2b35d0\",\n        \"value\": \"Same day check-ins may not be eligible for early or late check-in/outs. Please be courteous and ask the Team if its possible.\"\n    },\n    {\n        \"fieldId\": \"5dc03b0f628338001fb6b13f\",\n        \"value\": \"NO DOGS ALLOWED\"\n    }\n]"
          }
  - name: Unauthorized
    request:
      url: "{{baseUrl}}/reservations/:id/custom-fields"
      method: GET
      headers:
        - name: Accept
          value: application/json
        - name: authorization
          value: <API Key>
          description: "Added as a part of security scheme: apikey"
      params:
        - name: id
          value: ""
          type: path
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": {
              "code": "<string>",
              "message": "<string>"
            }
          }
  - name: Forbidden
    request:
      url: "{{baseUrl}}/reservations/:id/custom-fields"
      method: GET
      headers:
        - name: Accept
          value: application/json
        - name: authorization
          value: <API Key>
          description: "Added as a part of security scheme: apikey"
      params:
        - name: id
          value: ""
          type: path
    response:
      status: 403
      statusText: Forbidden
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: <string>
  - name: Not Found
    request:
      url: "{{baseUrl}}/reservations/:id/custom-fields"
      method: GET
      headers:
        - name: Accept
          value: application/json
        - name: authorization
          value: <API Key>
          description: "Added as a part of security scheme: apikey"
      params:
        - name: id
          value: ""
          type: path
