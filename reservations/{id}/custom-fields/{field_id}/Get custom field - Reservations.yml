info:
  name: Get custom field - Reservations
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/reservations/:id/custom-fields/:field_id"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: id
      value: <string>
      type: path
      description: (Required) Reservation ID
    - name: field_id
      value: <string>
      type: path
      description: (Required) Field ID
  auth:
    type: apikey
    key: authorization
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: Custom fields of reservation
    request:
      url: "{{baseUrl}}/reservations/:id/custom-fields/:field_id"
      method: GET
      headers:
        - name: Accept
          value: application/json
        - name: authorization
          value: <API Key>
          description: "Added as a part of security scheme: apikey"
      params:
        - name: id
          value: ""
          type: path
        - name: field_id
          value: ""
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "example": "{\n    \"_id\": \"63c6bc609e4384007c620a95\",\n    \"fieldId\": \"5dc03b42e28baf001e2b35d0\",\n    \"value\": \"Same day check-ins may not be eligible for early or late check-in/outs. Please be courteous and ask the Team if its possible.\"\n}"
          }
