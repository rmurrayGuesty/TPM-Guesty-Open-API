info:
  name: Approve a pending booking request
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/reservations/:id/approve"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: id
      value: <string>
      type: path
      description: (Required) Reservation ID
  auth:
    type: apikey
    key: authorization
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: Reservation object - _id and status fields
    request:
      url: "{{baseUrl}}/reservations/:id/approve"
      method: POST
      headers:
        - name: Accept
          value: application/json
        - name: authorization
          value: <API Key>
          description: "Added as a part of security scheme: apikey"
      params:
        - name: id
          value: ""
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
