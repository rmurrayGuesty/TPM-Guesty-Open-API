info:
  name: Add a payment to reservation
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/reservations/:id/payments"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: id
      value: <string>
      type: path
      description: (Required) Reservation ID
  body:
    type: json
    data: |-
      {
        "paymentMethod": {
          "method": "BANK_TRANSFER",
          "saveForFutureUse": "<boolean>",
          "id": "<string>"
        },
        "amount": "<number>",
        "shouldBePaidAt": "<date>",
        "paidAt": "<date>",
        "note": "<string>",
        "isAuthorizationHold": "<boolean>"
      }
  auth:
    type: apikey
    key: authorization
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

