info:
  name: Cancels a pending or recorded payment
  type: http
  seq: 1

http:
  method: PATCH
  url: "{{baseUrl}}/reservations/:id/payments/:paymentId/cancel"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: id
      value: <string>
      type: path
      description: (Required) Reservation ID
    - name: paymentId
      value: <string>
      type: path
      description: (Required) Payment ID
  auth:
    type: apikey
    key: authorization
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: Retrieve the updated reservation payments
    request:
      url: "{{baseUrl}}/reservations/:id/payments/:paymentId/cancel"
      method: PATCH
      headers:
        - name: Accept
          value: application/json
        - name: authorization
          value: <API Key>
          description: "Added as a part of security scheme: apikey"
      params:
        - name: id
          value: ""
          type: path
        - name: paymentId
          value: ""
          type: path
    response:
      status: 201
      statusText: Created
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "status": "<string>",
