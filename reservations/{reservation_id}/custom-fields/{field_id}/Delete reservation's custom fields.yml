info:
  name: Delete reservation's custom fields
  type: http
  seq: 1

http:
  method: DELETE
  url: "{{baseUrl}}/reservations/:reservation_id/custom-fields/:field_id"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: reservation_id
      value: <string>
      type: path
      description: (Required) Reservation ID
    - name: field_id
      value: <string>
      type: path
      description: (Required) Field ID
  auth:
    type: apikey
    key: authorization
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

