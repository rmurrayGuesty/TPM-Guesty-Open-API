info:
  name: Get a specific task
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/tasks-open-api/:taskId"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: taskId
      value: <string>
      type: path
      description: (Required) Task id
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

