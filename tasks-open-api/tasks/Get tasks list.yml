info:
  name: Get tasks list
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/tasks-open-api/tasks"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: filters
      value: <string>
      type: query
      description: Object of filters to query by
      disabled: true
    - name: columns
      value: <string>
      type: query
      description: (Required) Selection of columns, separated by space
      disabled: true
    - name: limit
      value: <number>
      type: query
      description: Pagination
      disabled: true
    - name: skip
      value: <number>
      type: query
      description: Indication of number of results to skip
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

