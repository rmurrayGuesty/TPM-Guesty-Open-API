          value: application/json
        - name: authorization
          value: <API Key>
          description: "Added as a part of security scheme: apikey"
      params:
        - name: filters
          value: <string>
          type: query
          description: Object of filters to query by
        - name: columns
          value: <string>
          type: query
          description: (Required) Selection of columns, separated by space
        - name: limit
