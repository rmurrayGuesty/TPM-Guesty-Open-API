info:
  name: Get hooks
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/hooks?limit=<integer>&skip=<integer>&listingId=<string>&fields=<string>&sort=<string>"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: limit
      value: <integer>
      type: query
      description: "Pagination, max: 100"
    - name: skip
      value: <integer>
      type: query
      description: Pagination
    - name: listingId
      value: <string>
      type: query
      description: Limit to a specific listing
    - name: fields
      value: <string>
      type: query
      description: Selection of fields, separated by space
    - name: sort
      value: <string>
      type: query
      description: Field to sort by. Prepend - for DESC.
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

