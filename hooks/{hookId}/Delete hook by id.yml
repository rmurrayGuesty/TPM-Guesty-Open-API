info:
  name: Delete hook by id
  type: http
  seq: 3

http:
  method: DELETE
  url: "{{baseUrl}}/hooks/:hookId"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: hookId
      value: <string>
      type: path
      description: (Required) Saved Hook Id
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: Successful response
    request:
      url: "{{baseUrl}}/hooks/:hookId"
      method: DELETE
      headers:
        - name: Accept
          value: application/json
        - name: authorization
          value: <API Key>
          description: "Added as a part of security scheme: apikey"
      params:
        - name: hookId
          value: ""
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: ""
