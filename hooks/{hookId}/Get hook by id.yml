info:
  name: Get hook by id
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/hooks/:hookId?fields=<string>"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: fields
      value: <string>
      type: query
      description: Selection of fields, separated by space
    - name: hookId
      value: <string>
      type: path
      description: (Required) Saved Hook Id
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: OK
    request:
      url: "{{baseUrl}}/hooks/:hookId?fields=<string>"
      method: GET
      headers:
        - name: Accept
          value: application/json
        - name: authorization
          value: <API Key>
          description: "Added as a part of security scheme: apikey"
      params:
        - name: fields
          value: <string>
          type: query
          description: Selection of fields, separated by space
        - name: hookId
          value: ""
          type: path
