info:
  name: Retrieve Property Address
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/address/:id"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: id
      value: <string>
      type: path
      description: (Required) The Guesty ID of the property for which you would like to retrieve the address.
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: Return the address object.
    request:
      url: "{{baseUrl}}/address/:id"
      method: GET
      headers:
        - name: Accept
          value: application/json
        - name: authorization
          value: <API Key>
          description: "Added as a part of security scheme: apikey"
      params:
        - name: id
          value: ""
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "address": {
              "full": "<string>",
              "city": "<string>",
