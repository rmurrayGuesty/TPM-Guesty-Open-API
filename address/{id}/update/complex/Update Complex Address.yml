info:
  name: Update Complex Address
  type: http
  seq: 1

http:
  method: PUT
  url: "{{baseUrl}}/address/:id/update/complex"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: id
      value: <string>
      type: path
      description: (Required) The Guesty ID of the complex for which you would like to edit the address.
  body:
    type: json
    data: |-
      {
        "address": {
          "location": {
            "lat": "<number>",
            "lng": "<number>"
          },
          "full": "<string>",
          "apartment": "<string>",
          "city": "<string>",
          "country": "<string>",
          "county": "<string>",
          "floor": "<string>",
          "unitNumber": "<string>",
          "neighborhood": "<string>",
          "searchable": "<string>",
          "state": "<string>",
          "street": "<string>",
          "zipcode": "<string>",
          "buildingName": "<string>"
        },
        "publishedAddress": {
          "location": {
            "lat": "<number>",
            "lng": "<number>"
          },
          "full": "<string>",
          "apartment": "<string>",
          "city": "<string>",
          "country": "<string>",
          "county": "<string>",
          "floor": "<string>",
          "unitNumber": "<string>",
          "neighborhood": "<string>",
          "searchable": "<string>",
          "state": "<string>",
          "street": "<string>",
          "zipcode": "<string>",
          "buildingName": "<string>"
        },
        "isPublishedAddressEnabled": "<boolean>"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

