info:
  name: Create exported calendar link
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/icalendar-api/exported-calendars"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
        "listingId": "<string>",
        "adjustmentValueStart": 1,
        "adjustmentValueEnd": 1
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

