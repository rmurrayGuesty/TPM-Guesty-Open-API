info:
  name: Get active exported calendar
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/icalendar-api/exported-calendars?listingId=<string>"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: listingId
      value: <string>
      type: query
      description: (Required) Id of a listing to get exported calendars for
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: Exported calendar found
    request:
      url: "{{baseUrl}}/icalendar-api/exported-calendars?listingId=<string>"
      method: GET
      headers:
        - name: Accept
          value: application/json
        - name: authorization
          value: <API Key>
          description: "Added as a part of security scheme: apikey"
      params:
        - name: listingId
          value: <string>
          type: query
          description: (Required) Id of a listing to get exported calendars for
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": "<string>",
            "listingId": "<string>",
            "accountId": "<string>",
            "createdAt": "<string>",
            "updatedAt": "<string>",
            "url": "<string>",
            "lastSyncedAt": "<string>",
            "adjustmentValueStart": "<number>",
            "adjustmentValueEnd": "<number>"
          }
  - name: Listing not found
    request:
      url: "{{baseUrl}}/icalendar-api/exported-calendars?listingId=<string>"
      method: GET
      headers:
        - name: Accept
          value: application/json
        - name: authorization
          value: <API Key>
          description: "Added as a part of security scheme: apikey"
      params:
        - name: listingId
          value: <string>
          type: query
          description: (Required) Id of a listing to get exported calendars for
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: "{}"

docs: "

  \    Any listing can have only 1 exported calendar, composed by Guesty.\ 

  \    You can use the following request to retrieve an active exported-calendar for a specified listing.\ 

  \    Please, note, the response body will contain either an empty list, or a list with a single item - the exported calendar itself.

  \    You can use this endpoint to get currently active exported calendar, if you do not have its id.

  \    "
