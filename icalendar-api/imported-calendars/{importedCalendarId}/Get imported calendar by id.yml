info:
  name: Get imported calendar by id
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/icalendar-api/imported-calendars/:importedCalendarId"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: importedCalendarId
      value: <string>
      type: path
      description: (Required) Id of an imported calendars
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: Get a specific imported calendar
    request:
      url: "{{baseUrl}}/icalendar-api/imported-calendars/:importedCalendarId"
      method: GET
      headers:
        - name: Accept
          value: application/json
        - name: authorization
          value: <API Key>
          description: "Added as a part of security scheme: apikey"
      params:
        - name: importedCalendarId
          value: ""
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": "<string>",
            "listingId": "<string>",
            "accountId": "<string>",
            "createdAt": "<string>",
            "updatedAt": "<string>",
            "status": "suspended",
            "url": "<string>",
            "name": "<string>",
            "adjustmentValueStart": "<number>",
            "adjustmentValueEnd": "<number>",
            "lastSyncedAt": "<string>"
          }
  - name: Imported calendar not found
    request:
      url: "{{baseUrl}}/icalendar-api/imported-calendars/:importedCalendarId"
      method: GET
      headers:
        - name: Accept
          value: application/json
        - name: authorization
          value: <API Key>
          description: "Added as a part of security scheme: apikey"
      params:
        - name: importedCalendarId
          value: ""
          type: path
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: "{}"

docs: |2-
  
        To retrieve data for a specific imported calendar, 
        including iCalendar name, URL, state & events adjustment, 
        use the following request
