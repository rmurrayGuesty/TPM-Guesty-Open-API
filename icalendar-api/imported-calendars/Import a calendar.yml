info:
  name: Import a calendar
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/icalendar-api/imported-calendars"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "<string>",
        "url": "<string>",
        "listingId": "<string>",
        "adjustmentValueStart": 0,
        "adjustmentValueEnd": 0
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
