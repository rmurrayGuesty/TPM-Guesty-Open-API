info:
  name: Get imported calendars list
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/icalendar-api/imported-calendars?listingId=<string>"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: listingId
      value: <string>
      type: query
      description: (Required) Id of a listing to get imported calendars for
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: Returns a list of imported calendars
    request:
      url: "{{baseUrl}}/icalendar-api/imported-calendars?listingId=<string>"
      method: GET
      headers:
        - name: Accept
          value: application/json
        - name: authorization
          value: <API Key>
          description: "Added as a part of security scheme: apikey"
      params:
        - name: listingId
          value: <string>
          type: query
          description: (Required) Id of a listing to get imported calendars for
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": "<string>",
            "listingId": "<string>",
            "accountId": "<string>",
            "createdAt": "<string>",
            "updatedAt": "<string>",
            "status": "suspended",
            "url": "<string>",
            "name": "<string>",
            "adjustmentValueStart": "<number>",
            "adjustmentValueEnd": "<number>",
            "lastSyncedAt": "<string>"
          }
  - name: Listing not found
    request:
      url: "{{baseUrl}}/icalendar-api/imported-calendars?listingId=<string>"
      method: GET
      headers:
        - name: Accept
          value: application/json
        - name: authorization
          value: <API Key>
          description: "Added as a part of security scheme: apikey"
      params:
        - name: listingId
          value: <string>
          type: query
          description: (Required) Id of a listing to get imported calendars for
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: "{}"

docs: To retrieve a list of all imported calendars, use the following request.
