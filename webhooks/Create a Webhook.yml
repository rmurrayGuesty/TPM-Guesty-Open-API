info:
  name: Create a Webhook
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/webhooks"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
        "url": "<string>",
        "events": "task.updated"
      }
  auth:
    type: apikey
    key: authorization
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: The created webhook
    request:
      url: "{{baseUrl}}/webhooks"
      method: POST
      headers:
        - name: Content-Type
          value: application/json
        - name: Accept
          value: application/json
        - name: authorization
          value: <API Key>
          description: "Added as a part of security scheme: apikey"
      body:
        type: json
        data: |-
          {
            "url": "<string>",
            "events": "task.updated"
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "accountId": "<string>",
            "_id": "<string>",
            "url": "<string>",
            "events": "reservation.new"
          }
