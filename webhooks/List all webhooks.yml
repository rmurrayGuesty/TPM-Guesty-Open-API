info:
  name: List all webhooks
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/webhooks"
  headers:
    - name: Accept
      value: application/json
  auth:
    type: apikey
    key: authorization
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: Array of requested webhooks
    request:
      url: "{{baseUrl}}/webhooks"
      method: GET
      headers:
        - name: Accept
          value: application/json
        - name: authorization
          value: <API Key>
          description: "Added as a part of security scheme: apikey"
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            {
              "accountId": "<string>",
              "_id": "<string>",
              "url": "<string>",
              "events": "reservation_update_shortlist"
            },
            {
              "accountId": "<string>",
              "_id": "<string>",
              "url": "<string>",
              "events": "guest.deleted"
            }
          ]

