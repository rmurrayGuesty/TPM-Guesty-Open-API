info:
  name: Create a Quote
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/quotes"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
        "checkInDateLocalized": "<string>",
        "checkOutDateLocalized": "<string>",
        "listingId": "<string>",
        "source": "<string>",
        "guestsCount": "<number>",
        "numberOfGuests": {
          "numberOfChildren": "<number>",
          "numberOfInfants": "<number>",
          "numberOfAdults": "<number>"
        },
        "ignoreCalendar": "<boolean>",
        "ignoreTerms": "<boolean>",
        "ignoreBlocks": "<boolean>",
        "couponCode": "<string>"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

