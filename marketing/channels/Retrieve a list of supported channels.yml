info:
  name: Retrieve a list of supported channels.
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/marketing/channels"
  headers:
    - name: Accept
      value: application/json
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: Return a list of supported channels
    request:
      url: "{{baseUrl}}/marketing/channels"
      method: GET
      headers:
        - name: Accept
          value: application/json
        - name: authorization
          value: <API Key>
          description: "Added as a part of security scheme: apikey"
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            {
              "name": "<string>",
              "slug": "<string>"
            },
            {
              "name": "<string>",
              "slug": "<string>"
            }
          ]
  - name: Unauthorized Request.
    request:
      url: "{{baseUrl}}/marketing/channels"
      method: GET
      headers:
        - name: Accept
          value: application/json
        - name: authorization
          value: <API Key>
          description: "Added as a part of security scheme: apikey"
    response:
      status: 403
      statusText: Forbidden
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": {
              "code": "<string>",
              "message": "<string>"
            }
          }

