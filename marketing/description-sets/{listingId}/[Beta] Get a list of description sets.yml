info:
  name: "[Beta] Get a list of description sets."
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/marketing/description-sets/:listingId"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: listingId
      value: <string>
      type: path
      description: (Required) The listing ID whose description sets you wish to retrieve.
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: Return the list of Description Sets.
    request:
      url: "{{baseUrl}}/marketing/description-sets/:listingId"
      method: GET
      headers:
        - name: Accept
          value: application/json
        - name: authorization
          value: <API Key>
          description: "Added as a part of security scheme: apikey"
      params:
        - name: listingId
          value: ""
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "descriptionSets": [
              {
                "id": "<string>",
                "name": "<string>",
                "accountId": "<string>",
