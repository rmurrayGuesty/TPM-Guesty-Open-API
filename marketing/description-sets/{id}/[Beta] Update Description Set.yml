info:
  name: "[Beta] Update Description Set."
  type: http
  seq: 1

http:
  method: PUT
  url: "{{baseUrl}}/marketing/description-sets/:id"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: id
      value: <string>
      type: path
      description: (Required) The Description Set ID to update.
  body:
    type: json
    data: |-
      {
        "channels": [
          "<string>",
          "<string>"
        ],
        "name": "<string>"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

