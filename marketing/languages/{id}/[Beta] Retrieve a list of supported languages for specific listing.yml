info:
  name: "[Beta] Retrieve a list of supported languages for specific listing"
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/marketing/languages/:id"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: id
      value: <string>
      type: path
      description: (Required) The listing ID whose languages you wish to retrieve or upsert
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
