info:
  name: "[Beta] upsert supported languages for specific listing"
  type: http
  seq: 2

http:
  method: PUT
  url: "{{baseUrl}}/marketing/languages/:id?updateSubUnits=<boolean>"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: updateSubUnits
      value: <boolean>
      type: query
      description: If the list of active languages should be applied to all subunits
    - name: id
      value: <string>
      type: path
      description: (Required) The listing ID whose languages you wish to retrieve or upsert
  body:
    type: json
    data: |-
      {
        "activeLanguages": "<boolean>"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

