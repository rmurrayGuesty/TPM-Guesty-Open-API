info:
  name: Upsert translation
  type: http
  seq: 1

http:
  method: PUT
  url: "{{baseUrl}}/marketing/fields/:id/upsert?language=<string>"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: language
      value: <string>
      type: query
      description: (Required) Language slug for the translation
    - name: id
      value: <string>
      type: path
      description: (Required) The listing ID whose translations you wish to upsert.
  body:
    type: json
    data: |-
      {
        "active": "<boolean>",
        "title": "<string>",
        "summary": "<string>",
        "space": "<string>",
        "access": "<string>",
        "neighborhood": "<string>",
        "transit": "<string>",
        "notes": "<string>",
        "interactionWithGuests": "<string>",
        "checkInInstructions": {
          "primaryCheckIn": "<string>",
          "alternativeCheckIn": "<string>",
          "notes": "<string>",
          "welcomeMessage": "<string>"
        },
        "descriptionSetId": [
          "<string>",
          "<string>"
        ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

