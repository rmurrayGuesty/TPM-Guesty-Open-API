info:
  name: Get a list of translation fields
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/marketing/fields/:id?language=<string>"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: language
      value: <string>
      type: query
      description: (Required) Language slug for retrieving the translation. To get all translations for a specific listing, please use language=all.
    - name: id
      value: <string>
      type: path
      description: (Required) The listing ID whose translations you wish to retrieve.
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

