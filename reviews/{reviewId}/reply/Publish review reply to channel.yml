info:
  name: Publish review reply to channel
  type: http
  seq: 1

http:
  method: PUT
  url: "{{baseUrl}}/reviews/:reviewId/reply"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: reviewId
      value: ""
      type: path
      description: (Required) Guesty Review ID
  body:
    type: json
    data: |-
      {
        "reviewReply": "<string>"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: Upsert Review Reply Response
    request:
      url: "{{baseUrl}}/reviews/:reviewId/reply"
      method: PUT
      headers:
        - name: Content-Type
          value: application/json
        - name: Accept
          value: application/json
        - name: authorization
          value: <API Key>
          description: "Added as a part of security scheme: apikey"
      params:
        - name: reviewId
          value: ""
          type: path
      body:
        type: json
        data: |-
          {
            "reviewReply": "<string>"
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "_id": {},
            "accountId": {},
            "externalReviewId": "<string>",
            "channelId": "homeaway2",
            "listingId": {},
            "externalListingId": "<string>",
            "externalReservationId": "<string>",
            "rawReview": {},
            "subListingId": {},
            "complexId": {},
            "externalComplexId": "<string>",
            "reservationId": {},
            "guestId": {},
            "createdAt": "<string>",
            "updatedAt": "<string>",
            "createdAtGuesty": "<string>",
            "updatedAtGuesty": "<string>",
            "reviewReplies": [
              {
                "status": "PENDING",
                "reviewReply": "<string>",
                "replyAt": "<dateTime>"
              },
              {
                "status": "PENDING",
                "reviewReply": "<string>",
                "replyAt": "<dateTime>"
              }
            ]
          }
  - name: Unauthorized
    request:
      url: "{{baseUrl}}/reviews/:reviewId/reply"
      method: PUT
      headers:
        - name: Content-Type
          value: application/json
        - name: authorization
          value: <API Key>
          description: "Added as a part of security scheme: apikey"
      params:
        - name: reviewId
          value: ""
          type: path
      body:
        type: json
        data: |-
          {
            "reviewReply": "<string>"
          }
    response:
      status: 401
      statusText: Unauthorized
      body:
        type: text
        data: ""
  - name: Not Found
    request:
      url: "{{baseUrl}}/reviews/:reviewId/reply"
      method: PUT
      headers:
        - name: Content-Type
          value: application/json
        - name: authorization
          value: <API Key>
          description: "Added as a part of security scheme: apikey"
      params:
        - name: reviewId
          value: ""
          type: path
      body:
        type: json
        data: |-
          {
            "reviewReply": "<string>"
          }
    response:
      status: 404
      statusText: Not Found
      body:
        type: text
        data: ""

docs: Publish reply to channel and store in DB. Airbnb and Booking.com allow to publish only one reply per review. Airbnb allows to update reply. Booking.com does not allow to update reply
