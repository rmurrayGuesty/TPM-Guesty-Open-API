info:
  name: Retrieve reviews sorted descending by last update time
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/reviews?externalReviewId=<string>&skip=<number>&limit=<number>&endDate=<dateTime>&startDate=<dateTime>&externalReservationId=<string>&reservationId=<string>&listingId=<string>&channelId=<string>"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: externalReviewId
      value: <string>
      type: query
      description: Channel Review ID
    - name: skip
      value: <number>
      type: query
      description: The number of items to skip before starting to collect the result set
    - name: limit
      value: <number>
      type: query
      description: The numbers of items to return
    - name: endDate
      value: <dateTime>
      type: query
      description: End date-time, less than equal to updatedAt date-time of the review
    - name: startDate
      value: <dateTime>
      type: query
      description: Start date-time, greater than equal to updatedAt date-time of the review
    - name: externalReservationId
      value: <string>
      type: query
      description: Channel Reservation ID
    - name: reservationId
      value: <string>
      type: query
      description: Guesty Reservation ID
    - name: listingId
      value: <string>
      type: query
      description: Guesty Listing ID
    - name: channelId
      value: <string>
      type: query
      description: Channel
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

