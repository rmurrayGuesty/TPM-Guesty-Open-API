info:
  name: Retrieve Property's Rate Strategy.
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/rm-rate-strategies-open-api/rate-strategies/unitType/:unitTypeId"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: unitTypeId
      value: <string>
      type: path
      description: (Required) Unit type id.
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

