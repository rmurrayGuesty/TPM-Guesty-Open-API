info:
  name: Query vendors
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/vendors?limit=25&skip=0"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: limit
      value: "25"
      type: query
      description: Pagination param. Limit the number of results
    - name: skip
      value: "0"
      type: query
      description: Pagination param. Skip a number of the first results.
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

