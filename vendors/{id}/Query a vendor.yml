info:
  name: Query a vendor
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/vendors/:id"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: id
      value: <string>
      type: path
      description: (Required) Vendor id to get
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: Vendor response
    request:
      url: "{{baseUrl}}/vendors/:id"
      method: GET
      headers:
        - name: Accept
          value: application/json
        - name: authorization
          value: <API Key>
          description: "Added as a part of security scheme: apikey"
      params:
        - name: id
          value: ""
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": "<string>",
            "company": "<string>",
            "firstName": "<string>",
            "lastName": "<string>",
            "phone": [
              "<string>",
              "<string>"
            ],
            "email": [
              "<string>",
              "<string>"
            ],
            "fullName": "<string>",
            "address": "<string>",
            "code": "<string>",
            "notes": "<string>"
          }
  - name: You do not have sufficient permissions to access this resource
    request:
      url: "{{baseUrl}}/vendors/:id"
      method: GET
      headers:
        - name: Accept
          value: application/json
