info:
  name: GET Rate Plan Calendar
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/rm-rate-plans-ext/ari-calendar/listing/:listingId/ratePlan/:ratePlanId?fromDate=<dateTime>&toDate=<dateTime>"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: fromDate
      value: <dateTime>
      type: query
      description: (Required) Period start date.
    - name: toDate
      value: <dateTime>
      type: query
      description: (Required) Period end date.
    - name: listingId
      value: ""
      type: path
      description: (Required) Property ID.
    - name: ratePlanId
      value: ""
      type: path
      description: (Required) Rate plan ID.
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

