info:
  name: Get All Rate Plans
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/rm-rate-plans-ext/rate-plans?skip=0&limit=25&sort=<string>"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: skip
      value: "0"
      type: query
      description: (Required) The number of items to skip before starting to collect the result set.
    - name: limit
      value: "25"
      type: query
      description: (Required) The numbers of items to return.
    - name: sort
      value: <string>
      type: query
      description: (Required) The field by which to sort the items returned.
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

