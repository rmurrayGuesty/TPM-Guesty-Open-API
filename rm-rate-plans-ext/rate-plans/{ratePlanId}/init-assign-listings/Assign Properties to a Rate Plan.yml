info:
  name: Assign Properties to a Rate Plan
  type: http
  seq: 1

http:
  method: PUT
  url: "{{baseUrl}}/rm-rate-plans-ext/rate-plans/:ratePlanId/init-assign-listings"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: ratePlanId
      value: <string>
      type: path
      description: (Required) The rate plan ID.
  body:
    type: json
    data: |-
      {
        "listingIds": [
          "<string>",
          "<string>"
        ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
