info:
  name: List guest's payment methods
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/guests/:id/payment-methods?reuse=true"
  params:
    - name: reuse
      value: "true"
      type: query
      description: Retrieve methods allowed for reusage in other guest's reservations
    - name: id
      value: <string>
      type: path
      description: (Required) Guest ID
  auth:
    type: apikey
    key: authorization
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: List of payment methods
    request:
      url: "{{baseUrl}}/guests/:id/payment-methods?reuse=true"
      method: GET
      headers:
        - name: authorization
          value: <API Key>
          description: "Added as a part of security scheme: apikey"
      params:
        - name: reuse
          value: "true"
          type: query
          description: Retrieve methods allowed for reusage in other guest's reservations
        - name: id
          value: ""
          type: path
    response:
      status: 200
      statusText: OK
      body:
        type: text
        data: ""

docs: Retrieve payment method list by guest id
