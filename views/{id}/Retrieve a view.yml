info:
  name: Retrieve a view
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/views/:id?fields=<string>"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: fields
      value: <string>
      type: query
      description: Selection of fields, separated by space
    - name: id
      value: <string>
      type: path
      description: (Required) View ID
  auth:
    type: apikey
    key: authorization
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: View object
    request:
      url: "{{baseUrl}}/views/:id?fields=<string>"
      method: GET
      headers:
        - name: Accept
          value: application/json
        - name: authorization
          value: <API Key>
          description: "Added as a part of security scheme: apikey"
      params:
        - name: fields
          value: <string>
          type: query
          description: Selection of fields, separated by space
        - name: id
          value: ""
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "_id": "<string>",
            "accountId": "<string>",
            "title": "<string>",
            "filters": [
              {
                "field": "<string>",
                "operator": "<string>",
                "value": "<string>",
                "context": null
              },
              {
                "field": "<string>",
                "operator": "<string>",
                "value": "<string>",
                "context": null
              }
            ],
            "fields": "<string>",
            "sort": "<string>",
            "createdAt": "<string>",
            "updatedAt": "<string>",
            "scheduledEmails": [
              {
                "hour": "<number>",
                "days": "<array>",
                "recipient": "<string>"
              },
              {
                "hour": "<number>",
                "days": "<array>",
                "recipient": "<string>"
              }
            ],
            "shares": [
              {
                "contactId": "<string>"
              },
              {
                "contactId": "<string>"
              }
            ]
          }
