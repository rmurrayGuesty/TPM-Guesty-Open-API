info:
  name: Update a view
  type: http
  seq: 2

http:
  method: PUT
  url: "{{baseUrl}}/views/:id"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: id
      value: <string>
      type: path
      description: (Required) View ID
  body:
    type: json
    data: |-
      {
        "_id": "<string>",
        "accountId": "<string>",
        "title": "<string>",
        "filters": [
          {
            "field": "<string>",
            "operator": "<string>",
            "value": "<string>",
            "context": null
