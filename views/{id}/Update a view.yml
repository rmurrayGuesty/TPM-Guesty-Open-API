            "field": "<string>",
            "operator": "<string>",
            "value": "<string>",
            "context": null
          }
        ],
        "fields": "<string>",
        "sort": "<string>",
        "createdAt": "<string>",
        "updatedAt": "<string>",
        "scheduledEmails": [
          {
            "hour": "<number>",
            "days": "<array>",
            "recipient": "<string>"
          },
          {
            "hour": "<number>",
            "days": "<array>",
            "recipient": "<string>"
          }
        ],
        "shares": [
          {
            "contactId": "<string>"
          },
          {
            "contactId": "<string>"
          }
        ]
      }
  auth:
    type: apikey
    key: authorization
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

