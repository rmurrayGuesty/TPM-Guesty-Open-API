info:
  name: Retrieve all views
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/views?section=<string>&fields=&limit=25&skip=0"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: section
      value: <string>
      type: query
      description: (Required) One of listings, reservations
    - name: fields
      value: ""
      type: query
      description: Selection of fields, separated by space. When null retrieves all object.
    - name: limit
      value: "25"
      type: query
      description: Pagination
    - name: skip
      value: "0"
      type: query
      description: Pagination
  auth:
    type: apikey
    key: authorization
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

