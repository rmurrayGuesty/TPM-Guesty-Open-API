info:
  name: Retrieve a listing's paymentProviderId
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/listings/{{id}}?fields=paymentProviderId&fields=<string>"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: fields
      value: paymentProviderId
      type: query
    - name: fields
      value: <string>
      type: query
      description: Listings fields to retrieve
  auth:
    type: apikey
    key: authorization
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: Listings PaymentProviderId
    request:
      url: "{{baseUrl}}/listings/{{id}}?fields=<string>"
      method: GET
      headers:
        - name: Accept
          value: application/json
        - name: authorization
          value: <API Key>
          description: "Added as a part of security scheme: apikey"
      params:
        - name: fields
          value: <string>
          type: query
          description: Listings fields to retrieve
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "paymentProviderId": "<string>",
            "paymentProvider": {
              "id": "<string>",
              "status": "<string>",
              "syncedAt": "<date>",
              "lastPendingPaymentDate": "<date>",
              "pendingPaymentsCount": "<number>",
              "paymentMethodsCount": "<number>",
              "providerAccountId": "<string>",
              "isDefault": "<boolean>",
              "providerType": "<string>",
              "connectedBy": "<string>",
              "accountName": "<string>",
              "defaultCurrency": "<string>",
              "statsLastUpdated": "<date>"
            }
          }

docs: " providerAccountId is important! - this is how you identify with Stripe once the clearing payment"
