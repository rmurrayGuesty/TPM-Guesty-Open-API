info:
  name: List all cities
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/listings/cities"
  headers:
    - name: Accept
      value: application/json
  auth:
    type: apikey
    key: authorization
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: Array of cities (strings).
    request:
      url: "{{baseUrl}}/listings/cities"
      method: GET
      headers:
        - name: Accept
          value: application/json
        - name: authorization
          value: <API Key>
          description: "Added as a part of security scheme: apikey"
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "example": [
              "Burnt Ranch",
              "New York",
              "Autun",
              "Kfar Sirkin",
              "London",
              "Newton",
              "Atlanta",
              "Montpelier",
              "Tel Aviv-Yafo",
              "Decatur",
              "Vancouver",
              "Amsterdam",
              "Cuyahoga Falls",
              "Palo Alto",
              "Ramat Gan"
            ]
          }
