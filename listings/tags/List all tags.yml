info:
  name: List all tags
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/listings/tags"
  headers:
    - name: Accept
      value: application/json
  auth:
    type: apikey
    key: authorization
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: Array of tags (strings).
    request:
      url: "{{baseUrl}}/listings/tags"
      method: GET
      headers:
        - name: Accept
          value: application/json
        - name: authorization
          value: <API Key>
          description: "Added as a part of security scheme: apikey"
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "example": [
              "Tag A",
              "Tag B",
              "Tag C"
            ]
          }
