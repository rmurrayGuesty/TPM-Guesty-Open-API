info:
  name: Update listing's Custom Fields
  type: http
  seq: 3

http:
  method: PUT
  url: "{{baseUrl}}/listings/:id/custom-fields"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: id
      value: <string>
      type: path
      description: "(Required) "
  body:
    type: json
    data: |-
      {
        "customFields": [
          {
            "fieldId": "<string>",
            "value": "<string>"
          },
          {
            "fieldId": "<string>",
            "value": "<string>"
          }
        ]
      }
  auth:
    type: apikey
    key: authorization
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: The updated object.
    request:
      url: "{{baseUrl}}/listings/:id/custom-fields"
      method: PUT
      headers:
        - name: Content-Type
