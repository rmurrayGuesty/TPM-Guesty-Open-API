info:
  name: Delete listing's custom fields
  type: http
  seq: 1

http:
  method: DELETE
  url: "{{baseUrl}}/listings/:listing_id/custom-fields/:field_id"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: listing_id
      value: <string>
      type: path
      description: "(Required) "
    - name: field_id
      value: <string>
      type: path
      description: "(Required) "
  auth:
    type: apikey
    key: authorization
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: Untitled Response
    request:
      url: "{{baseUrl}}/listings/:listing_id/custom-fields/:field_id"
      method: DELETE
      headers:
        - name: Accept
          value: application/json
        - name: authorization
          value: <API Key>
          description: "Added as a part of security scheme: apikey"
      params:
        - name: listing_id
          value: ""
          type: path
        - name: field_id
          value: ""
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
