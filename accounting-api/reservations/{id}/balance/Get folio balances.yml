info:
  name: Get folio balances
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/accounting-api/reservations/:id/balance"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: id
      value: <string>
      type: path
      description: (Required) Reservation ID
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: Folio balances response
    request:
      url: "{{baseUrl}}/accounting-api/reservations/:id/balance"
      method: GET
      headers:
        - name: Accept
          value: application/json
        - name: authorization
          value: <API Key>
          description: "Added as a part of security scheme: apikey"
      params:
        - name: id
          value: ""
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "currency": "<string>",
            "balance": "<number>",
            "ledgers": [
              {
                "name": "<string>",
                "balance": "<number>"
              },
              {
                "name": "<string>",
                "balance": "<number>"
              }
