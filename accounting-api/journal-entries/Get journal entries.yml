info:
  name: Get journal entries
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/accounting-api/journal-entries?operator=@in_past&value=<string>&name=<string>&description=<string>&reservationConfirmationCodes=<string>&reservationConfirmationCodes=<string>&ledger=AD&ledger=AD&guests=<string>&guests=<string>&vendors=<string>&vendors=<string>&owners=<string>&owners=<string>&listings=<string>&listings=<string>&chargeCode=FT&chargeCode=PO&triggers=OPENAPI&triggers=PERIODIC&skip=<number>&limit=<number>&sortByDate=DESC"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: operator
      value: "@in_past"
      type: query
      description: |
        (Required) DO NOT use the format provided in the coding playground output.
            Fields in this query param must be transformed according to the rules explained below.
            For example, in order to fetch the information for past 7 days:
        1. Form your object first
        ```json
        {
          "operator": "@in_past_days",
          "value": 7
        }
        ```

        2. Then encode it to sanitized URL (see the code example written in JS below)
        ```js
        encodeURIComponent(JSON.stringify({"operator": "@in_past_days", "value": 7}))
        ```

        3. The final query param structure should be looked like
        ```
        transactionDate=%7B%22operator%22%3A%22%40in_past_days%22%2C%22value%22%3A7%7D
        ```
    - name: value
      value: <string>
      type: query
      description: |
        (Required) DO NOT use the format provided in the coding playground output.
