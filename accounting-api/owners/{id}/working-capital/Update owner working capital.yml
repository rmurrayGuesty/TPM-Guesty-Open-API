info:
  name: Update owner working capital
  type: http
  seq: 2

http:
  method: PUT
  url: "{{baseUrl}}/accounting-api/owners/:id/working-capital"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: id
      value: <string>
      type: path
      description: (Required) Owner ID
  body:
    type: json
    data: |-
      {
        "workingCapital": "<number>"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

