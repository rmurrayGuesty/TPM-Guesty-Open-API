info:
  name: Delete Custom Field
  type: http
  seq: 2

http:
  method: DELETE
  url: "{{baseUrl}}/accounts/:id/custom-fields/:field_id"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: id
      value: <string>
      type: path
      description: "(Required) "
    - name: field_id
      value: <string>
      type: path
      description: "(Required) "
  auth:
    type: apikey
    key: authorization
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

