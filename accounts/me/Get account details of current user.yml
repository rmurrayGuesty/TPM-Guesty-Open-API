info:
  name: Get account details of current user.
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/accounts/me"
  headers:
    - name: Accept
      value: application/json
  auth:
    type: apikey
    key: authorization
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: Retrieved account details.
    request:
      url: "{{baseUrl}}/accounts/me"
