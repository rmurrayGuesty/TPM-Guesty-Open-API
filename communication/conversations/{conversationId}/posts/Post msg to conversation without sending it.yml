info:
  name: Post msg to conversation without sending it
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/communication/conversations/:conversationId/posts"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: conversationId
      value: <string>
      type: path
      description: (Required) Saved Conversation Id
  body:
    type: json
    data: |-
      {
        "module": {
          "type": "<string>"
        },
        "body": "<string>",
        "sentBy": "<string>"
      }
  auth:
    type: apikey
    key: authorization
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
