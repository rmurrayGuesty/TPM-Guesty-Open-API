info:
  name: Get conversation by id
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/communication/conversations/:conversationId?fields=<string>"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: fields
      value: <string>
      type: query
      description: |-
        Selection of fields, separated by space. 

         When `null` retrieve the main properties of the object. 

        We recommend always specifying the specific fields you'd like to receive to ensure that you get them. Please see the full list above.
    - name: conversationId
      value: <string>
      type: path
      description: (Required) Saved Conversation Id
  auth:
    type: apikey
    key: authorization
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

