info:
  name: Get guest code
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/guest-code?reservationId=<string>"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: reservationId
      value: <string>
      type: query
      description: (Required) Reservation ID for which the guest code is needed
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

