info:
  name: Calculate additional fee amount for quote [Beta]
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/additional-fees/quotes/:quoteId/amount"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: quoteId
      value: <string>
      type: path
      description: (Required) Quote id
  body:
    type: json
    data: |-
      {
        "ids": [
          "<string>",
          "<string>"
        ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

