info:
  name: Update existing additional fee
  type: http
  seq: 1

http:
  method: PATCH
  url: "{{baseUrl}}/additional-fees/:id"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json; charset=utf-8
  params:
    - name: id
      value: <string>
      type: path
      description: (Required) id of item to update
  body:
    type: json
    data: |-
      {
        "name": "<string>",
        "type": "TRANSFER",
        "value": "<integer>",
        "isPercentage": "<boolean>",
        "targetFee": "CLEANING_FEE",
        "multiplier": "PER_STAY",
        "isSyncToSupportedChannelsEnabled": "<boolean>",
        "isAutomated": "<boolean>",
        "allPlatforms": "<boolean>",
        "automationPlatforms": [
          "agoda",
          "bookingPal"
        ],
        "allSources": "<boolean>",
        "automationSources": [
          "<string>",
          "<string>"
        ],
        "allRUSources": "<boolean>",
        "RUSources": [
          "expedia",
          "expedia"
        ],
        "isDeducted": "<boolean>",
        "isBundled": "<boolean>"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

