info:
  name: Get list of additional fees for account
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/additional-fees/account"
  headers:
    - name: Accept
      value: application/json; charset=utf-8
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

