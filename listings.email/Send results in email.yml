info:
  name: Send results in email
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/listings.email"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
        "to": {
          "to": 9983678.687029138
        }
      }
  auth:
    type: apikey
    key: authorization
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: Array of listing objects
    request:
      url: "{{baseUrl}}/listings.email"
      method: POST
      headers:
        - name: Content-Type
          value: application/json
        - name: Accept
          value: application/json
        - name: authorization
          value: <API Key>
          description: "Added as a part of security scheme: apikey"
      body:
        type: json
        data: |-
          {
            "to": {
              "to": 9983678.687029138
            }
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: ""

docs: Same as /listings but results are sent as an email
