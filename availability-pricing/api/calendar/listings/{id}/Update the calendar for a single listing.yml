info:
  name: Update the calendar for a single listing
  type: http
  seq: 2

http:
  method: PUT
  url: "{{baseUrl}}/availability-pricing/api/calendar/listings/:id"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: id
      value: <string>
      type: path
      description: (Required) Listing ID
  body:
    type: json
    data: |-
      {
        "startDate": "<string>",
        "endDate": "<string>",
        "status": "available",
        "price": "<number>",
        "isBasePrice": "<boolean>",
        "minNights": "<integer>",
        "isBaseMinNights": "<boolean>",
        "note": "<string>",
        "cta": "<boolean>",
        "ctd": "<boolean>",
        "useChildValues": "<boolean>",
        "blockReason": "Owner block"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: Returns ok if the update successful
    request:
      url: "{{baseUrl}}/availability-pricing/api/calendar/listings/:id"
      method: PUT
      headers:
        - name: Content-Type
          value: application/json
        - name: Accept
          value: application/json
        - name: authorization
          value: <API Key>
          description: "Added as a part of security scheme: apikey"
      params:
        - name: id
