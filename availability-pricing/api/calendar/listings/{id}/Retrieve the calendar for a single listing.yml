info:
  name: Retrieve the calendar for a single listing
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/availability-pricing/api/calendar/listings/:id?startDate=<string>&endDate=<string>&includeAllotment=<boolean>&ignoreInactiveChildAllotment=<boolean>&ignoreUnlistedChildAllotment=<boolean>"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: startDate
      value: <string>
      type: query
      description: "(Required) First day to be returned (format: YYYY-MM-DD)"
    - name: endDate
      value: <string>
      type: query
      description: "(Required) Last day to be returned (format: YYYY-MM-DD)"
    - name: includeAllotment
      value: <boolean>
      type: query
      description: Return day objects including allotment
    - name: ignoreInactiveChildAllotment
      value: <boolean>
      type: query
      description: Specify ignoreInactiveChildAllotment=true to exclude inactive sub-units from the allotment calculation. Default value is false.
    - name: ignoreUnlistedChildAllotment
      value: <boolean>
      type: query
      description: Specify ignoreUnlistedChildAllotment=true to exclude unlisted sub-units from the allotment calculation. Default value is false.
    - name: id
      value: <string>
      type: path
      description: (Required) Listing ID
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: Calendar with available/unavailable dates
    request:
      url: "{{baseUrl}}/availability-pricing/api/calendar/listings/:id?startDate=<string>&endDate=<string>&includeAllotment=<boolean>&ignoreInactiveChildAllotment=<boolean>&ignoreUnlistedChildAllotment=<boolean>"
      method: GET
      headers:
        - name: Accept
          value: application/json
        - name: authorization
          value: <API Key>
          description: "Added as a part of security scheme: apikey"
      params:
        - name: startDate
          value: <string>
          type: query
          description: "(Required) First day to be returned (format: YYYY-MM-DD)"
        - name: endDate
          value: <string>
          type: query
          description: "(Required) Last day to be returned (format: YYYY-MM-DD)"
        - name: includeAllotment
          value: <boolean>
          type: query
