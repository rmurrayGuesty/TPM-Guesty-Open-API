info:
  name: Update a Smart Calendar Rule
  type: http
  seq: 3

http:
  method: PUT
  url: "{{baseUrl}}/api/scr-v2/open-api/:scrId"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: scrId
      value: <string>
      type: path
      description: (Required) The ID of the smart calendar rule to update
  body:
    type: json
    data: |-
      {
        "isTwoWayRule": "<boolean>",
        "applyRetroactively": "<boolean>",
        "triggers": {
          "manual": "<boolean>"
        },
        "isActive": "<boolean>"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: Smart calendar rule updated
    request:
      url: "{{baseUrl}}/api/scr-v2/open-api/:scrId"
      method: PUT
      headers:
        - name: Content-Type
          value: application/json
        - name: Accept
          value: application/json
        - name: authorization
          value: <API Key>
          description: "Added as a part of security scheme: apikey"
      params:
        - name: scrId
          value: ""
          type: path
      body:
        type: json
        data: |-
          {
            "isTwoWayRule": "<boolean>",
            "applyRetroactively": "<boolean>",
            "triggers": {
              "manual": "<boolean>"
            },
            "isActive": "<boolean>"
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": "<string>",
            "accountId": "<string>",
            "sourceListingId": "<string>",
            "destinationListingId": "<string>",
            "isTwoWayRule": "<boolean>",
            "isActive": "<boolean>",
            "status": "removed",
            "triggers": {
              "manual": "<boolean>"
            },
            "createdAt": "<dateTime>",
            "updatedAt": "<dateTime>"
          }
  - name: Smart calendar rule was not found. Please check scrId
    request:
      url: "{{baseUrl}}/api/scr-v2/open-api/:scrId"
      method: PUT
      headers:
        - name: Content-Type
          value: application/json
        - name: authorization
          value: <API Key>
          description: "Added as a part of security scheme: apikey"
      params:
        - name: scrId
          value: ""
          type: path
      body:
        type: json
        data: |-
          {
            "isTwoWayRule": "<boolean>",
            "applyRetroactively": "<boolean>",
            "triggers": {
              "manual": "<boolean>"
            },
            "isActive": "<boolean>"
          }
    response:
      status: 404
      statusText: Not Found
      body:
        type: text
        data: ""

