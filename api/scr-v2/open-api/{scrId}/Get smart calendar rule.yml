info:
  name: Get smart calendar rule
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/scr-v2/open-api/:scrId"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: scrId
      value: <string>
      type: path
      description: (Required) The ID of the smart calendar rule to fetch
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: The record has been successfully fetched
    request:
      url: "{{baseUrl}}/api/scr-v2/open-api/:scrId"
      method: GET
      headers:
        - name: Accept
          value: application/json
        - name: authorization
          value: <API Key>
          description: "Added as a part of security scheme: apikey"
      params:
        - name: scrId
          value: ""
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": "<string>",
            "accountId": "<string>",
            "sourceListingId": "<string>",
            "destinationListingId": "<string>",
            "isTwoWayRule": "<boolean>",
            "isActive": "<boolean>",
            "status": "removed",
            "triggers": {
              "manual": "<boolean>"
            },
            "createdAt": "<dateTime>",
            "updatedAt": "<dateTime>"
          }
  - name: Smart calendar rule was not found. Please check smart calendar rule ID
    request:
      url: "{{baseUrl}}/api/scr-v2/open-api/:scrId"
      method: GET
      headers:
        - name: authorization
          value: <API Key>
          description: "Added as a part of security scheme: apikey"
      params:
        - name: scrId
          value: ""
          type: path
    response:
      status: 404
      statusText: Not Found
      body:
        type: text
        data: ""

docs: Get a specific Smart Calendar Rule
