info:
  name: Create a smart calendar rule
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/api/scr-v2/open-api"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
        "sourceListingId": "<string>",
        "destinationListingId": "<string>",
        "isTwoWayRule": "<boolean>",
        "applyRetroactively": "<boolean>",
        "triggers": {
          "manual": "<boolean>"
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
