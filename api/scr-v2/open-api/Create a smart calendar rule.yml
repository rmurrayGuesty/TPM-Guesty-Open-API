      method: POST
      headers:
        - name: Content-Type
          value: application/json
        - name: Accept
          value: application/json
        - name: authorization
          value: <API Key>
          description: "Added as a part of security scheme: apikey"
      body:
        type: json
        data: |-
          {
            "sourceListingId": "<string>",
            "destinationListingId": "<string>",
            "isTwoWayRule": "<boolean>",
            "applyRetroactively": "<boolean>",
            "triggers": {
              "manual": "<boolean>"
            }
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: Content-Type
          value: application/json
      body:
