info:
  name: Get calendar block logs
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/block-logs?listingId=<string>&userName=<string>&startDate=<string>&endDate=<string>&blockType=preparation_time&eventType=updated"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: listingId
      value: <string>
      type: query
      description: Filters the logs by the Guesty listing ID.
    - name: userName
      value: <string>
      type: query
      description: Filter logs based on the user who created the block.
    - name: startDate
      value: <string>
      type: query
      description: Filter logs based on the block's start date.
    - name: endDate
      value: <string>
      type: query
      description: Filter logs based on the block's end date.
    - name: blockType
      value: preparation_time
      type: query
      description: Filters logs by the type of block (manual or preparation_time).
    - name: eventType
      value: updated
      type: query
      description: Filters logs by the event type (created, updated, removed).
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

