info:
  name: Update owner document
  type: http
  seq: 3

http:
  method: PATCH
  url: "{{baseUrl}}/owners/:ownerId/documents/:documentId"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: ownerId
      value: <string>
      type: path
      description: (Required) Owner id
    - name: documentId
      value: <string>
      type: path
      description: (Required) Document id
  body:
    type: json
    data: |-
      {
        "name": "<string>",
        "description": "<string>",
        "type": "CONTRACT",
        "isShared": "<boolean>",
        "startDate": "<dateTime>",
        "endDate": "<dateTime>"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

