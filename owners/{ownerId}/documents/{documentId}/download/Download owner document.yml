info:
  name: Download owner document
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/owners/:ownerId/documents/:documentId/download"
  headers:
    - name: Accept
      value: application/pdf
  params:
    - name: ownerId
      value: <string>
      type: path
      description: (Required) Owner id
    - name: documentId
      value: <string>
      type: path
      description: (Required) Document id
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
