          value: <API Key>
          description: "Added as a part of security scheme: apikey"
      params:
        - name: ownerId
          value: ""
          type: path
        - name: documentId
          value: ""
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
