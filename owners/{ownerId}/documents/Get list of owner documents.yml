info:
  name: Get list of owner documents
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/owners/:ownerId/documents?skip=0&limit=10&sort=-_id&includeDeleted=false"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: skip
      value: "0"
      type: query
      description: Pagination start index
    - name: limit
      value: "10"
      type: query
      description: Limit amount of results per page
    - name: sort
      value: -_id
      type: query
      description: Ordered list of field names to sort by, separated by spaces
    - name: includeDeleted
      value: "false"
      type: query
      description: Include deleted documents, true/false
    - name: ownerId
      value: <string>
      type: path
      description: (Required) Owner id
  auth:
    type: apikey
    key: authorization
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

