info:
  name: Create an owner document
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/owners/:ownerId/documents"
  headers:
    - name: Content-Type
      value: multipart/form-data
    - name: Accept
      value: application/json
  params:
    - name: ownerId
      value: <string>
      type: path
      description: (Required) Owner id
  body:
    type: multipart-form
    data:
      - name: file
        type: file
        value: []
        description: (Required) Document in pdf format, maximum size 5 MB
      - name: name
        type: text
        value: <string>
        description: "(Required) "
      - name: description
        type: text
        value: <string>
      - name: type
        type: text
        value: DOCUMENT
        description: Type of the document, defaults to DOCUMENT (This can only be one of DOCUMENT,CONTRACT)
      - name: isShared
        type: text
        value: <boolean>
      - name: startDate
        type: text
        value: <dateTime>
        description: Date in YYYY-MM-DD format
      - name: endDate
        type: text
        value: <dateTime>
        description: Date in YYYY-MM-DD format
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

