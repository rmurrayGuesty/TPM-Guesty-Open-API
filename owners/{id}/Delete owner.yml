http:
  method: DELETE
  url: "{{baseUrl}}/owners/:id"
  params:
    - name: id
      value: <string>
      type: path
      description: (Required) Owner's ID
  auth:
    type: apikey
    key: authorization
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
