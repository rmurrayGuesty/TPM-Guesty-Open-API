info:
  name: Get owner
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/owners/:id?fields=<string>"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: fields
      value: <string>
      type: query
      description: |-
        Selection of fields, separated by space. If fields not be chosen response will be return with all fields.

        `fields`:
        > `_id` `ownersPortalSettings` `listings` `locale` `active` `allowReservations` `showReservationTooltips` `businessInformation` `birthday` `anniversary` `workingCapital` `firstName` `lastName` `fullName` `email` `address` `phone` `picture` `notes` `createdAt`
    - name: id
      value: <string>
      type: path
      description: (Required) Owner's ID
  auth:
    type: apikey
    key: authorization
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
