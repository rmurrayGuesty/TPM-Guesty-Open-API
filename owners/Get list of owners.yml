info:
  name: Get list of owners
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/owners?pagination=<boolean>&limit=<number>&skip=<number>&sort=<string>&q=<string>&fields=<string>"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: pagination
      value: <boolean>
      type: query
      description: Use pagination response
    - name: limit
      value: <number>
      type: query
      description: When use pagination, limit amount of docs per page
    - name: skip
      value: <number>
      type: query
      description: When use pagination
    - name: sort
      value: <string>
      type: query
      description: Ordered list of fields name to sort by, separated by spaces.
    - name: q
      value: <string>
      type: query
      description: Query against (fullName OR lastName OR firstName)
    - name: fields
      value: <string>
      type: query
      description: |-
        Selection of fields, separated by space. If fields not be chosen response will be return with all fields.

        `fields`:
        > `_id` `ownersPortalSettings` `listings` `locale` `active` `allowReservations` `showReservationTooltips` `businessInformation` `birthday` `anniversary` `workingCapital` `firstName` `lastName` `fullName` `email` `address` `phone` `picture` `notes` `createdAt`
  auth:
    type: apikey
    key: authorization
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

