info:
  name: Get tax level configuration
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/taxes/level-configurations/unit-type/:id"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: id
      value: <string>
      type: path
      description: (Required) The unit type id
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: The taxes level configuration of the given unitTypeId.
    request:
      url: "{{baseUrl}}/taxes/level-configurations/unit-type/:id"
      method: GET
      headers:
        - name: Accept
          value: application/json
        - name: authorization
          value: <API Key>
          description: "Added as a part of security scheme: apikey"
      params:
        - name: id
          value: ""
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "unitTypeId": "<string>",
            "accountId": "<string>",
            "levelEntityType": "UNIT_TYPE"
          }
  - name: The input provided is invalid.
    request:
      url: "{{baseUrl}}/taxes/level-configurations/unit-type/:id"
      method: GET
      headers:
        - name: authorization
          value: <API Key>
          description: "Added as a part of security scheme: apikey"
      params:
        - name: id
          value: ""
          type: path
    response:
      status: 400
      statusText: Bad Request
      body:
        type: text
        data: ""

