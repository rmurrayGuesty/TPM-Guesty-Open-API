http:
  method: DELETE
  url: "{{baseUrl}}/taxes/:id"
  params:
    - name: id
      value: <string>
      type: path
      description: (Required) The tax id
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

