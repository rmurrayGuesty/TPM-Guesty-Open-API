info:
  name: Get account level taxes
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/taxes/account"
  headers:
    - name: Accept
      value: application/json
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

