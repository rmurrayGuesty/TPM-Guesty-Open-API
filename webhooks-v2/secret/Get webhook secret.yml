info:
  name: Get webhook secret
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/webhooks-v2/secret?url=<string>"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: url
      value: <string>
      type: query
      description: "(Required) "
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: Successful response
    request:
      url: "{{baseUrl}}/webhooks-v2/secret?url=<string>"
      method: GET
      headers:
        - name: Accept
          value: application/json
        - name: authorization
          value: <API Key>
          description: "Added as a part of security scheme: apikey"
      params:
        - name: url
          value: <string>
          type: query
          description: "(Required) "
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: "{}"

docs: Get the secret for a webhook endpoint
