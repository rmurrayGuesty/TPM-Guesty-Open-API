info:
  name: Get brand by property_id.
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/account-brands/properties/:propertyId"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: propertyId
      value: <string>
      type: path
      description: (Required) Property(listing) Id.
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: Success response
    request:
      url: "{{baseUrl}}/account-brands/properties/:propertyId"
      method: GET
      headers:
        - name: Accept
          value: application/json
        - name: authorization
          value: <API Key>
          description: "Added as a part of security scheme: apikey"
      params:
        - name: propertyId
          value: ""
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "propertyBrand": {
              "id": "<string>",
              "name": "<string>",
              "logoUrl": "<string>",
              "address": {},
              "email": "<string>",
              "accountId": "<string>",
              "createdAt": "<dateTime>",
              "updatedAt": "<dateTime>",
              "currency": "<string>",
              "phoneNumber": "<string>",
              "vatNum": "<string>"
            },
            "default": {
              "id": "<string>",
              "name": "<string>",
              "logoUrl": "<string>",
              "address": {},
              "email": "<string>",
              "accountId": "<string>",
              "createdAt": "<dateTime>",
              "updatedAt": "<dateTime>",
              "currency": "<string>",
              "phoneNumber": "<string>",
              "vatNum": "<string>"
            }
          }
  - name: API error.
    request:
      url: "{{baseUrl}}/account-brands/properties/:propertyId"
      method: GET
      headers:
        - name: Accept
          value: application/json
        - name: authorization
          value: <API Key>
          description: "Added as a part of security scheme: apikey"
      params:
        - name: propertyId
          value: ""
          type: path
    response:
      status: 500
      statusText: Internal Server Error
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: "{}"

docs: Http endpoint to retrieve brandings by property id.
