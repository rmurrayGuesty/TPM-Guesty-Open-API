info:
  name: Send results in email
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/reservations.email?filters=[object Object]&filters=[object Object]&fields=<string>&sort=<string>&limit=<integer>&skip=<integer>"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: filters
      value: "[object Object]"
      type: query
      description: Array of filters to query by
    - name: filters
      value: "[object Object]"
      type: query
      description: Array of filters to query by
    - name: fields
      value: <string>
      type: query
      description: Selection of fields, separated by space
    - name: sort
      value: <string>
      type: query
      description: "Sorting, default: `checkIn`"
    - name: limit
      value: <integer>
      type: query
      description: "Limit for list of records. Default value: `250`, max: `500`"
    - name: skip
      value: <integer>
      type: query
      description: Skip number of records. In case nothing provided so nothing will be skipped
  body:
    type: json
    data: |-
      {
        "to": "<string>"
      }
  auth:
    type: apikey
    key: authorization
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

