info:
  name: List closed airbnb resolutions for reservation
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/airbnb-resolutions-center/reservations/:guestyReservationId/resolutions?from=<string>&to=<string>"
  params:
    - name: from
      value: <string>
      type: query
      description: (Required) Created at from
    - name: to
      value: <string>
      type: query
      description: (Required) Created at to
    - name: guestyReservationId
      value: <string>
      type: path
      description: (Required) Reservation id in Guesty
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: Closed resolutions and amounts summaries
    request:
      url: "{{baseUrl}}/airbnb-resolutions-center/reservations/:guestyReservationId/resolutions?from=<string>&to=<string>"
      method: GET
      headers:
        - name: authorization
          value: <API Key>
          description: "Added as a part of security scheme: apikey"
      params:
        - name: from
          value: <string>
          type: query
          description: (Required) Created at from
        - name: to
          value: <string>
          type: query
          description: (Required) Created at to
        - name: guestyReservationId
          value: ""
          type: path
    response:
      status: 200
      statusText: OK
      body:
        type: text
        data: ""
  - name: The params provided are invalid.
    request:
      url: "{{baseUrl}}/airbnb-resolutions-center/reservations/:guestyReservationId/resolutions?from=<string>&to=<string>"
      method: GET
      headers:
        - name: authorization
          value: <API Key>
          description: "Added as a part of security scheme: apikey"
      params:
        - name: from
          value: <string>
          type: query
          description: (Required) Created at from
        - name: to
          value: <string>
          type: query
          description: (Required) Created at to
        - name: guestyReservationId
          value: ""
          type: path
    response:
      status: 400
      statusText: Bad Request
      body:
        type: text
        data: ""

