info:
  name: Edit space beds
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/properties/spaces/space/:spaceId/edit"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json; charset=utf-8
  params:
    - name: spaceId
      value: <string>
      type: path
      description: (Required) spaceId to edit
  body:
    type: json
    data: |-
      {
        "beds": {
          "KING_BED": 0,
          "QUEEN_BED": 0,
          "DOUBLE_BED": 0,
          "SINGLE_BED": 0,
          "SOFA_BED": 0,
          "AIR_MATTRESS": 0,
          "BUNK_BED": 0
        },
        "other": {
          "FLOOR_MATTRESS": 0,
          "WATER_BED": 0,
          "TODDLER_BED": 0,
          "CRIB": 0
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: Returns the edited space
    request:
      url: "{{baseUrl}}/properties/spaces/space/:spaceId/edit"
      method: POST
      headers:
        - name: Content-Type
          value: application/json
