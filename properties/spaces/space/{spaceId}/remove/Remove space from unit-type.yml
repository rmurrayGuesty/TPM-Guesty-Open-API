info:
  name: Remove space from unit-type
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/properties/spaces/space/:spaceId/remove"
  headers:
    - name: Accept
      value: application/json; charset=utf-8
  params:
    - name: spaceId
      value: <string>
      type: path
      description: (Required) spaceId to remove
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: Space was removed, returns the spaces left on the unitType
    request:
      url: "{{baseUrl}}/properties/spaces/space/:spaceId/remove"
      method: POST
      headers:
        - name: Accept
          value: application/json; charset=utf-8
        - name: authorization
          value: <API Key>
          description: "Added as a part of security scheme: apikey"
      params:
        - name: spaceId
          value: ""
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
