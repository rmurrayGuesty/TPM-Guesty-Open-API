info:
  name: List house rules
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/properties/house-rules/?propertyIds=<string>,<string>"
  headers:
    - name: Accept
      value: application/json; charset=utf-8
  params:
    - name: propertyIds
      value: <string>,<string>
      type: query
      description: (Required) IDs of the requested unitTypes
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

