info:
  name: Retrieve unit-type house-rules
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/properties/house-rules/unit-type/:unitTypeId"
  headers:
    - name: Accept
      value: application/json; charset=utf-8
  params:
    - name: unitTypeId
      value: <string>
      type: path
      description: (Required) ID of the requested unitType
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: House rules fields of unitType
    request:
      url: "{{baseUrl}}/properties/house-rules/unit-type/:unitTypeId"
      method: GET
      headers:
        - name: Accept
          value: application/json; charset=utf-8
        - name: authorization
          value: <API Key>
          description: "Added as a part of security scheme: apikey"
      params:
        - name: unitTypeId
          value: ""
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "suitableForChildren": "<boolean>",
            "suitableForInfants": "<boolean>",
            "petsAllowed": "<boolean>",
            "petsCharged": "<boolean>",
            "smokingAllowed": "<boolean>",
            "partiesAllowed": "<boolean>",
            "additionalRules": "<string>",
            "quietHours": {
              "set": "<boolean>",
              "start": "<string>",
              "end": "<string>"
            },
            "minimumAge": "<integer>"
          }
