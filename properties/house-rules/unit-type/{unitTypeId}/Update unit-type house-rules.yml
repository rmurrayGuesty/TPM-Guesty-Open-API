          "enabled": "<boolean>"
        },
        "suitableForEvents": {
          "enabled": "<boolean>"
        },
        "minimumAge": "<integer>"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

