info:
  name: Get payment provider by listing id
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/payment-providers/provider-by-listing?includeInactiveProviders=false&listingId=&fields=<string>"
  headers:
    - name: Accept
      value: application/json; charset=utf-8
  params:
    - name: includeInactiveProviders
      value: "false"
      type: query
      description: include inactive providers in the response.
    - name: listingId
      value: ""
      type: query
      description: (Required) listing id
    - name: fields
      value: <string>
      type: query
      description: Selection of fields, separated by space. When null retrieve the main properties of the object. We recommend always specifying the specific fields you'd like to receive to ensure that you get them.
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: Response received
    request:
      url: "{{baseUrl}}/payment-providers/provider-by-listing?includeInactiveProviders=false&listingId=&fields=<string>"
      method: GET
      headers:
        - name: Accept
          value: application/json; charset=utf-8
        - name: authorization
          value: <API Key>
          description: "Added as a part of security scheme: apikey"
      params:
        - name: includeInactiveProviders
          value: "false"
          type: query
          description: include inactive providers in the response.
        - name: listingId
          value: ""
