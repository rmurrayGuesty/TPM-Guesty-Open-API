info:
  name: Get default payment provider
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/payment-providers/default"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: Response received
    request:
      url: "{{baseUrl}}/payment-providers/default"
      method: GET
      headers:
        - name: authorization
          value: <API Key>
          description: "Added as a part of security scheme: apikey"
    response:
      status: 200
      statusText: OK
      body:
        type: text
        data: ""
