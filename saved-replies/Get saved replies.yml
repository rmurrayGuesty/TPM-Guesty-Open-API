info:
  name: Get saved replies
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/saved-replies?limit=<integer>&skip=<integer>&listingId=<string>&accountId=<string>&returnDefault=<boolean>&fields=<string>&sort=<string>&q=<string>"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: limit
      value: <integer>
      type: query
      description: "Pagination limit, max: 100"
    - name: skip
      value: <integer>
      type: query
      description: How many results should be skipped to get to the current page
    - name: listingId
      value: <string>
      type: query
      description: Limit results to a specific listing
    - name: accountId
      value: <string>
      type: query
      description: Limit results to a specific account
    - name: returnDefault
      value: <boolean>
      type: query
      description: To get Guesty defaults SRs
    - name: fields
      value: <string>
      type: query
      description: Selection of fields, separated by space. See response schema to get list of fields
    - name: sort
      value: <string>
      type: query
      description: Field to sort by. Prepend - for DESC.
    - name: q
      value: <string>
      type: query
      description: Search query string. Searches in question and folder. Search is case-insensitive.
  auth:
    type: apikey
    key: authorization
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

