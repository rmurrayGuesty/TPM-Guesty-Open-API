info:
  name: Delete saved reply by id
  type: http
  seq: 3

http:
  method: DELETE
  url: "{{baseUrl}}/saved-replies/:replyId"
  headers:
    - name: Accept
      value: text/plain
  params:
    - name: replyId
      value: <string>
      type: path
      description: (Required) Saved Reply Id
  auth:
    type: apikey
    key: authorization
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: Successful response
    request:
      url: "{{baseUrl}}/saved-replies/:replyId"
      method: DELETE
      headers:
        - name: Accept
          value: text/plain
        - name: authorization
          value: <API Key>
          description: "Added as a part of security scheme: apikey"
      params:
        - name: replyId
          value: ""
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: text/plain
      body:
        type: text
        data: <string>
  - name: Not found
    request:
      url: "{{baseUrl}}/saved-replies/:replyId"
      method: DELETE
      headers:
        - name: Accept
          value: text/plain
        - name: authorization
          value: <API Key>
          description: "Added as a part of security scheme: apikey"
      params:
        - name: replyId
          value: ""
          type: path
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: text/plain
      body:
        type: text
        data: <string>
