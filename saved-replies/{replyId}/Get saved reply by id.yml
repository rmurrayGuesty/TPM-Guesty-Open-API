info:
  name: Get saved reply by id
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/saved-replies/:replyId?fields=<string>"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: fields
      value: <string>
      type: query
      description: Selection of fields, separated by space. See response schema to get the list of fields.
    - name: replyId
      value: <string>
      type: path
      description: (Required) Saved reply Id
  auth:
    type: apikey
    key: authorization
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

