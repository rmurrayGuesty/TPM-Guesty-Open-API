info:
  name: Authentication
  type: http
  seq: 1

http:
  method: POST
  url: https://open-api.guesty.com/oauth2/token
  headers:
    - name: Content-Type
      value: application/x-www-form-urlencoded
    - name: Accept
      value: application/json
    - name: ""
      value: ""
  body:
    type: form-urlencoded
    data:
      - name: grant_type
        value: client_credentials
  auth:
    type: basic
    username: "{{client_Id}}"
    password: "{{client_Secret}}"

